name: Activate content protection

on:
  push:
    branches:
      - security/manual-content-protection-activation

permissions:
  contents: write

jobs:
  activate:
    if: ${{ !contains(github.event.head_commit.message, '[reference-normalized]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout security branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Normalize reference sections in content-protection.js
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('content-protection.js')
          text = path.read_text(encoding='utf-8')

          pattern = re.compile(
              r"  function normalizeReferenceSections\(\) \{.*?\n  \}\n\n  function ensureKlaster1References",
              re.S,
          )

          replacement = '''  function normalizeReferenceSections() {
    const candidates = document.querySelectorAll('section, details');
    candidates.forEach(container => {
      const heading = container.matches('details')
        ? container.querySelector(':scope > summary')
        : (container.querySelector(':scope > h2') || container.querySelector(':scope > h3'));
      if (!heading) return;

      const raw = heading.textContent.replace(/\\s+/g, ' ').trim();
      const lower = raw.toLowerCase();
      const isReference = lower.includes('dasar hukum') || lower.includes('dasar &') || lower.includes('referensi');
      if (!isReference) return;

      container.classList.add('references-section');

      if (heading.matches('h2, h3')) {
        const prefixMatch = raw.match(/^\\s*(\\d+\\s*[·.)-]\\s*)/);
        const prefix = prefixMatch ? prefixMatch[1] : '';
        heading.textContent = `${prefix}Dasar Hukum & Referensi`;
      }
    });
  }

  function ensureKlaster1References'''

          new_text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('normalizeReferenceSections target block not found')

          old_css = '.references-section li, .references-section li strong, .references-section ol li, .references-section ol li strong { font-weight: 500 !important; }'
          new_css = '.references-section li, .references-section li strong, .references-section ol li, .references-section ol li strong, .references-section .source-list li, .references-section .source-list li strong { font-weight: 500 !important; }'
          if old_css in new_text:
              new_text = new_text.replace(old_css, new_css, 1)
          elif new_css not in new_text:
              raise SystemExit('Reference CSS target not found')

          path.write_text(new_text, encoding='utf-8')
          print('Centralized reference normalization applied.')

      - name: Validate JavaScript and reference rules
        shell: bash
        run: |
          node --check content-protection.js
          python - <<'PY'
          from pathlib import Path
          text = Path('content-protection.js').read_text(encoding='utf-8')
          checks = [
              ('reference section detector', "lower.includes('referensi')" in text),
              ('legacy title detector', "lower.includes('dasar &')" in text),
              ('canonical heading', 'Dasar Hukum & Referensi' in text),
              ('regular reference CSS', '.references-section li strong' in text),
              ('Klaster 1 reference injector preserved', 'function ensureKlaster1References()' in text),
          ]
          for name, ok in checks:
              print(('PASS' if ok else 'FAIL') + ': ' + name)
          failed = [name for name, ok in checks if not ok]
          if failed:
              raise SystemExit('Validation failed: ' + ', '.join(failed))
          PY

      - name: Restore workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/activate-content-protection.yml > .github/workflows/activate-content-protection.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content-protection.js .github/workflows/activate-content-protection.yml
          git commit -m 'fix: normalize reference headings and typography [reference-normalized]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
