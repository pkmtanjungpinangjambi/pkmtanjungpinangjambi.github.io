name: Apply content protection

on:
  push:
    branches:
      - security/content-protection

permissions:
  contents: write

jobs:
  inject:
    if: ${{ !contains(github.event.head_commit.message, '[security-autopatch]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Inject protection into HTML pages
        shell: bash
        run: |
          set -euo pipefail
          changed=0

          while IFS= read -r -d '' file; do
            if ! grep -q 'content-protection.js' "$file"; then
              python3 - "$file" <<'PY'
import pathlib
import sys

path = pathlib.Path(sys.argv[1])
text = path.read_text(encoding='utf-8')
needle = '</body>'

if needle not in text:
    raise SystemExit(f'No closing body tag found: {path}')

replacement = '  <script src="content-protection.js" defer></script>\n\n</body>'
path.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
PY
              changed=1
            fi
          done < <(find . -type f -name '*.html' -not -path './.git/*' -print0)

          if [ "$changed" -eq 0 ]; then
            echo 'No HTML files needed protection injection.'
            rm -f .github/workflows/apply-content-protection.yml
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- .github/workflows/apply-content-protection.yml
            git commit -m 'chore: remove temporary protection injector [security-autopatch]'
            git push
            exit 0
          fi

          rm -f .github/workflows/apply-content-protection.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html' .github/workflows/apply-content-protection.yml
          git commit -m 'security: inject content protection script [security-autopatch]'
          git push
