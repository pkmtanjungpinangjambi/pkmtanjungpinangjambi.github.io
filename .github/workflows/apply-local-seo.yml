name: Apply Local SEO

on:
  push:
    branches:
      - seo/local-entity-20260907
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apply metadata, structured data, and sitemap
        shell: python
        run: |
          from __future__ import annotations
          from pathlib import Path
          import html
          import json
          import re
          import xml.etree.ElementTree as ET

          ORIGIN = 'https://pkmtanjungpinangjambi.vercel.app'
          cfg = json.loads(Path('seo/local-seo-config.json').read_text(encoding='utf-8'))

          PAGES = {
            'index.html': {
              'title': 'UPTD Puskesmas Tanjung Pinang Kota Jambi | Pelayanan Kesehatan',
              'description': 'Website resmi UPTD Puskesmas Tanjung Pinang Kota Jambi. Cek jadwal pelayanan, pendaftaran, layanan kesehatan, alamat, kontak, CKG, dan informasi kesehatan masyarakat.'
            },
            'profil.html': {
              'title': 'Profil UPTD Puskesmas Tanjung Pinang Kota Jambi',
              'description': 'Profil resmi UPTD Puskesmas Tanjung Pinang Kota Jambi: sejarah, visi misi, motto, tata nilai, karakteristik wilayah, jaringan pelayanan, dan arah pengembangan Puskesmas.'
            },
            'pelayanan.html': {
              'title': 'Pelayanan UPTD Puskesmas Tanjung Pinang Kota Jambi',
              'description': 'Informasi pelayanan UPTD Puskesmas Tanjung Pinang Kota Jambi berdasarkan lima klaster, termasuk layanan ibu dan anak, dewasa dan lansia, penyakit menular, lintas klaster, jadwal, tarif, dan layanan terkait.'
            },
            'jadwal.html': {
              'title': 'Jadwal Pelayanan Puskesmas Tanjung Pinang Kota Jambi',
              'description': 'Jadwal pelayanan UPTD Puskesmas Tanjung Pinang Kota Jambi, jam operasional, batas pendaftaran, jadwal imunisasi program, dan jadwal Posyandu wilayah kerja.'
            },
            'kontak.html': {
              'title': 'Kontak & Lokasi UPTD Puskesmas Tanjung Pinang Kota Jambi',
              'description': 'Alamat, nomor telepon, WhatsApp, email, pengaduan, media sosial, dan lokasi UPTD Puskesmas Tanjung Pinang Kota Jambi di Jambi Timur.'
            },
          }

          BREADCRUMBS = {
            'profil.html': [('Beranda','/'), ('Profil','/profil.html')],
            'pelayanan.html': [('Beranda','/'), ('Pelayanan','/pelayanan.html')],
            'jadwal.html': [('Beranda','/'), ('Pelayanan','/pelayanan.html'), ('Jadwal Pelayanan','/jadwal.html')],
            'kontak.html': [('Beranda','/'), ('Kontak & Lokasi','/kontak.html')],
          }

          def replace_tag(text, pattern, replacement):
            if re.search(pattern, text, flags=re.I | re.S):
              return re.sub(pattern, replacement, text, count=1, flags=re.I | re.S)
            return text.replace('</head>', replacement + '\n</head>', 1)

          def set_title(text, value):
            return replace_tag(text, r'<title>.*?</title>', f'<title>{html.escape(value)}</title>')

          def set_meta(text, attr, name, value):
            escaped = html.escape(value, quote=True)
            pat = rf'<meta\s+{attr}=["\']{re.escape(name)}["\'][^>]*>'
            return replace_tag(text, pat, f'<meta {attr}="{name}" content="{escaped}">')

          def set_canonical(text, url):
            pat = r'<link\s+[^>]*rel=["\']canonical["\'][^>]*>'
            return replace_tag(text, pat, f'<link rel="canonical" href="{url}">')

          def schema(data, sid):
            return '<script type="application/ld+json" data-seo-id="' + sid + '">\n' + json.dumps(data, ensure_ascii=False, indent=2) + '\n</script>'

          def remove_our_schema(text):
            return re.sub(r'<script\s+type=["\']application/ld\+json["\']\s+data-seo-id=["\'](local-business|website|breadcrumb)["\'][^>]*>.*?</script>\s*', '', text, flags=re.I | re.S)

          local_business = {
            '@context':'https://schema.org',
            '@type':'MedicalClinic',
            '@id':ORIGIN + '/#organization',
            'name':cfg['name'],
            'alternateName':cfg['alternateName'],
            'description':'Fasilitas pelayanan kesehatan tingkat pertama di Kecamatan Jambi Timur, Kota Jambi.',
            'url':ORIGIN + '/',
            'logo':ORIGIN + cfg['logo'],
            'image':ORIGIN + cfg['image'],
            'telephone':cfg['telephone'],
            'email':cfg['email'],
            'address':{
              '@type':'PostalAddress',
              'streetAddress':cfg['streetAddress'],
              'addressLocality':cfg['addressLocality'],
              'addressRegion':cfg['addressRegion'],
              'addressCountry':cfg['addressCountry']
            },
            'areaServed':[
              {'@type':'Place','name':'Kelurahan Tanjung Pinang'},
              {'@type':'Place','name':'Kelurahan Sijinjang'},
              {'@type':'Place','name':'Kelurahan Kasang'},
              {'@type':'Place','name':'Kelurahan Kasang Jaya'},
              {'@type':'Place','name':'Kelurahan Rajawali'}
            ],
            'openingHoursSpecification':[
              {'@type':'OpeningHoursSpecification','dayOfWeek':['Monday','Tuesday','Wednesday','Thursday'],'opens':'07:15','closes':'13:45'},
              {'@type':'OpeningHoursSpecification','dayOfWeek':'Friday','opens':'07:15','closes':'10:30'},
              {'@type':'OpeningHoursSpecification','dayOfWeek':'Saturday','opens':'07:15','closes':'13:30'}
            ],
            'sameAs':cfg['social'],
            'hasMap':'https://www.google.com/maps/dir/?api=1&destination=UPTD%20Puskesmas%20Tanjung%20Pinang%20Kota%20Jambi'
          }

          website = {
            '@context':'https://schema.org',
            '@type':'WebSite',
            '@id':ORIGIN + '/#website',
            'url':ORIGIN + '/',
            'name':cfg['name'],
            'inLanguage':'id-ID',
            'publisher':{'@id':ORIGIN + '/#organization'}
          }

          def breadcrumb(items):
            return {
              '@context':'https://schema.org',
              '@type':'BreadcrumbList',
              'itemListElement':[
                {'@type':'ListItem','position':i,'name':name,'item':ORIGIN + href}
                for i,(name,href) in enumerate(items,1)
              ]
            }

          for path, meta in PAGES.items():
            p = Path(path)
            text = p.read_text(encoding='utf-8')
            text = set_title(text, meta['title'])
            text = set_meta(text, 'name', 'description', meta['description'])
            text = set_meta(text, 'name', 'robots', 'index,follow,max-image-preview:large')
            url = ORIGIN + ('/' if path == 'index.html' else '/' + path)
            text = set_canonical(text, url)
            for n,v in {
              'og:type':'website','og:locale':'id_ID','og:site_name':cfg['name'],
              'og:title':meta['title'],'og:description':meta['description'],'og:url':url,
              'og:image':ORIGIN + cfg['image']
            }.items():
              text = set_meta(text, 'property', n, v)
            for n,v in {
              'twitter:card':'summary_large_image','twitter:title':meta['title'],
              'twitter:description':meta['description'],'twitter:image':ORIGIN + cfg['image']
            }.items():
              text = set_meta(text, 'name', n, v)

            text = remove_our_schema(text)
            blocks = []
            if path in ('index.html','kontak.html'):
              blocks.append(schema(local_business,'local-business'))
            if path == 'index.html':
              blocks.append(schema(website,'website'))
            if path in BREADCRUMBS:
              blocks.append(schema(breadcrumb(BREADCRUMBS[path]),'breadcrumb'))
            if blocks:
              text = text.replace('</head>', '\n' + '\n'.join(blocks) + '\n</head>', 1)
            p.write_text(text, encoding='utf-8')

          root = ET.Element('urlset', {'xmlns':'http://www.sitemaps.org/schemas/sitemap/0.9'})
          excluded = {'404.html', 'profil-2.html', 'struktur.html'}
          public_pages = sorted(
            p.name for p in Path('.').glob('*.html')
            if p.name not in excluded and not p.name.startswith('_') and not p.name.startswith('preview-')
          )
          for name in public_pages:
            u = ORIGIN + ('/' if name == 'index.html' else '/' + name)
            ET.SubElement(ET.SubElement(root,'url'),'loc').text = u
          xml = ET.tostring(root, encoding='unicode')
          Path('sitemap.xml').write_text('<?xml version="1.0" encoding="UTF-8"?>\n' + xml + '\n', encoding='utf-8')
          print('Patched local SEO metadata for', len(PAGES), 'pages')
          print('Sitemap URLs:', len(public_pages))

      - name: Commit generated SEO changes
        shell: bash
        run: |
          git config user.name 'UPTD Puskesmas Tanjung Pinang Kota Jambi'
          git config user.email '313901015+pkmtanjungpinangjambi@users.noreply.github.com'
          git add index.html profil.html pelayanan.html jadwal.html kontak.html sitemap.xml
          if git diff --cached --quiet; then
            echo 'No SEO changes to commit.'
            exit 0
          fi
          git commit -m 'feat(seo): strengthen local search signals'
          git push origin HEAD
