name: batang-patch
on:
  push:
    branches: [feat/klaster1-batang-20260914]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add BATANG item
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('manajemen-puskesmas.html')
          s=p.read_text(encoding='utf-8')
          old='</div><div class="admin-ref"><strong>Rujukan utama:</strong>'
          new='''<details class="admin-item"><summary><span class="admin-index">07</span>BATANG — Buku Administrasi Tamu Aktual Nyata Digital</summary><div class="admin-body"><strong>Fitur administrasi buku tamu elektronik Puskesmas.</strong><br>BATANG digunakan untuk membantu pencatatan kunjungan tamu secara digital sebagai bagian dari ketatausahaan. Fitur ini bersifat administratif dan bukan layanan klinis pasien. Pengelolaan data mengikuti kewenangan dan kebutuhan internal Puskesmas.</div></details>\n</div><div class="admin-ref"><strong>Rujukan utama:</strong>'''
          if s.count(old) != 1:
              raise SystemExit('target marker not found exactly once')
          p.write_text(s.replace(old,new), encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manajemen-puskesmas.html .github/workflows/batang-patch.yml
          git commit -m "feat: add BATANG to Ketatausahaan" || exit 0
          git push
