name: Complete Canonical SEO

on:
  push:
    branches:
      - seo/local-entity-20260907

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Add canonical and missing descriptions to indexed pages
        shell: python
        run: |
          from pathlib import Path
          import html
          import re
          from urllib.parse import urlsplit

          ORIGIN = 'https://pkmtanjungpinangjambi.vercel.app'
          sitemap = Path('sitemap.xml').read_text(encoding='utf-8')
          urls = re.findall(r'<loc>\s*([^<]+?)\s*</loc>', sitemap)
          pages = []
          for url in urls:
            parsed = urlsplit(url)
            if f'{parsed.scheme}://{parsed.netloc}' != ORIGIN:
              continue
            name = parsed.path.strip('/') or 'index.html'
            if name.endswith('.html'):
              pages.append(name)

          descriptions = {
            'struktur-organisasi.html': 'Struktur organisasi UPTD Puskesmas Tanjung Pinang Kota Jambi, susunan unsur organisasi, hubungan kerja, dan pembagian peran dalam penyelenggaraan pelayanan kesehatan primer.',
          }

          for name in sorted(set(pages)):
            path = Path(name)
            if not path.is_file():
              raise SystemExit(f'Sitemap references missing file: {name}')
            text = path.read_text(encoding='utf-8')
            canonical = ORIGIN + ('/' if name == 'index.html' else '/' + name)
            pat = r'<link\s+[^>]*rel=["\']canonical["\'][^>]*>'
            tag = f'<link rel="canonical" href="{canonical}">'
            if re.search(pat, text, flags=re.I):
              text = re.sub(pat, tag, text, count=1, flags=re.I)
            else:
              text = text.replace('</head>', tag + '\n</head>', 1)

            robots_pat = r'<meta\s+name=["\']robots["\'][^>]*>'
            robots_tag = '<meta name="robots" content="index,follow,max-image-preview:large">'
            if re.search(robots_pat, text, flags=re.I):
              text = re.sub(robots_pat, robots_tag, text, count=1, flags=re.I)
            else:
              text = text.replace('</head>', robots_tag + '\n</head>', 1)

            if name in descriptions:
              desc = html.escape(descriptions[name], quote=True)
              desc_pat = r'<meta\s+name=["\']description["\'][^>]*>'
              desc_tag = f'<meta name="description" content="{desc}">'
              if re.search(desc_pat, text, flags=re.I):
                text = re.sub(desc_pat, desc_tag, text, count=1, flags=re.I)
              else:
                text = text.replace('</head>', desc_tag + '\n</head>', 1)

            path.write_text(text, encoding='utf-8')
          print('Canonical/robots coverage completed for', len(set(pages)), 'sitemap pages')

      - name: Commit canonical SEO changes
        shell: bash
        run: |
          git config user.name 'UPTD Puskesmas Tanjung Pinang Kota Jambi'
          git config user.email '313901015+pkmtanjungpinangjambi@users.noreply.github.com'
          git add '*.html'
          if git diff --cached --quiet; then
            echo 'No canonical changes to commit.'
            exit 0
          fi
          git commit -m 'fix(seo): complete canonical and robots coverage'
          git push origin HEAD
