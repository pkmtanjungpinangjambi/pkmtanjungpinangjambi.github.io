name: Final WebP + Information Audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  final-audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install WebP tools
        run: |
          sudo apt-get update
          sudo apt-get install -y webp

      - name: Convert raster images to WebP
        shell: bash
        run: |
          set -euo pipefail
          converted=0
          while IFS= read -r -d '' p; do
            out="${p%.*}.webp"
            if [ -f "$out" ]; then
              continue
            fi
            case "${p##*.}" in
              jpg|JPG|jpeg|JPEG) cwebp -quiet -q 85 "$p" -o "$out" ;;
              png|PNG) cwebp -quiet -lossless "$p" -o "$out" ;;
            esac
            converted=$((converted + 1))
          done < <(find . -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' \) -not -path './.git/*' -print0)
          echo "Converted $converted new raster image(s) to WebP."

      - name: Update local image references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('.')
          skip = {'.git', 'node_modules', '.venv'}
          exts = {'.html', '.htm', '.css', '.js', '.json', '.md', '.xml', '.txt'}
          pat = re.compile(r'(?<![A-Za-z0-9_./:-])(\S+?)\.(jpg|jpeg|png)(?=["\'\)\s>#?,]|$)', re.I)
          changed = []
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in exts or any(x in skip for x in p.parts):
                  continue
              try:
                  s = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              def repl(m):
                  token = m.group(1)
                  if token.startswith(('http://', 'https://', '//', 'data:')):
                      return m.group(0)
                  return token + '.webp'
              ns = pat.sub(repl, s)
              if ns != s:
                  p.write_text(ns, encoding='utf-8')
                  changed.append(str(p))
          print(f'Updated references in {len(changed)} file(s)')
          for p in changed:
              print(p)
          PY

      - name: Apply Information P0/P1 fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          info = Path('informasi.html')
          s = info.read_text(encoding='utf-8')
          old = '<button class="galeri-filter active" data-galeri-filter="semua">Semua</button>\n<button class="galeri-filter" data-galeri-filter="foto">Foto</button>\n<button class="galeri-filter" data-galeri-filter="video">Video</button>'
          new = '<button class="galeri-filter active" data-galeri-filter="semua">Semua</button>\n<button id="foto" class="galeri-filter" data-galeri-filter="foto">Foto</button>\n<button id="video" class="galeri-filter" data-galeri-filter="video">Video</button>'
          if old in s:
              s = s.replace(old, new, 1)
              info.write_text(s, encoding='utf-8')

          program = Path('program.html')
          s = program.read_text(encoding='utf-8')
          old_text = 'Pelayanan terpadu dalam 5 klaster: manajemen, umum &amp; gawat darurat, kesehatan ibu-anak &amp; KB, gizi, dan penyakit menular.'
          new_text = 'Pelayanan terintegrasi dalam 5 klaster sesuai struktur pelayanan UPTD Puskesmas Tanjung Pinang: Klaster 1 Manajemen, Klaster 2 Ibu &amp; Anak, Klaster 3 Usia Dewasa &amp; Lansia, Klaster 4 Penanggulangan Penyakit Menular, dan Klaster 5 Lintas Klaster.'
          s = s.replace(old_text, new_text, 1)
          s = s.replace('href="profil.html#klaster1">Lihat hasil →</a>', 'href="index.html#pengumuman">Lihat hasil IKM →</a>', 1)
          program.write_text(s, encoding='utf-8')
          PY

      - name: Validate migration and information fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          root = Path('.')
          info = Path('informasi.html').read_text(encoding='utf-8')
          program = Path('program.html').read_text(encoding='utf-8')
          checks = {
              'foto anchor': 'id="foto"' in info,
              'video anchor': 'id="video"' in info,
              'canonical 5-cluster wording': 'Klaster 3 Usia Dewasa &amp; Lansia' in program,
              'stale IKM anchor removed': 'href="profil.html#klaster1"' not in program,
          }
          for k, v in checks.items():
              print(('PASS' if v else 'FAIL') + ' - ' + k)
          if not all(checks.values()):
              sys.exit(1)

          pat = re.compile(r'(?<![A-Za-z0-9_./:-])([^\s"\'\)<>#?,]+\.webp)(?=["\'\)\s<>#?,]|$)', re.I)
          bad = []
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.html','.htm','.css','.js','.json','.md','.xml','.txt'} or '.git' in p.parts:
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              for ref in pat.findall(text):
                  if ref.startswith(('http://','https://','//','data:')):
                      continue
                  clean = ref.split('?',1)[0].split('#',1)[0]
                  if not ((p.parent / clean).exists() or (root / clean).exists()):
                      bad.append(f'{p}: {ref}')
          if bad:
              print('\n'.join(bad))
              sys.exit(1)
          webp_count = sum(1 for p in root.rglob('*.webp') if p.is_file() and '.git' not in p.parts)
          print(f'PASS - local WebP references resolve; {webp_count} WebP file(s) present')
          PY

      - name: Commit final changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No final changes required."
            exit 0
          fi
          git commit -m "feat: finalize webp and information audit"
          git push origin HEAD:work/information-webp-final-2026-09-01
