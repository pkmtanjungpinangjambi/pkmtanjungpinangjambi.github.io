name: Fix Batang Pinang nomenclature
on:
  push:
    branches:
      - fix/batang-pinang-nomenklatur-20260914
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact nomenclature fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('manajemen-puskesmas.html')
          s = p.read_text(encoding='utf-8')
          old = '<details class="admin-item"><summary><span class="admin-index">07</span>BATANG — Buku Administrasi Tamu Aktual Nyata Digital</summary><div class="admin-body"><strong>Buku tamu elektronik untuk pencatatan kunjungan tamu Puskesmas.</strong><br>BATANG ditempatkan sebagai bagian dari Ketatausahaan dan digunakan untuk mendukung pencatatan administrasi tamu secara tertib dan digital.</div></details>'
          new = '<details class="admin-item"><summary><span class="admin-index">07</span>Batang Pinang</summary><div class="admin-body"><strong>Buku Administrasi Tamu Aktual Nyata Digital Puskesmas Tanjung Pinang.</strong><br>Batang Pinang ditempatkan sebagai bagian dari Ketatausahaan dan digunakan untuk mendukung pencatatan administrasi tamu secara tertib dan digital.</div></details>'
          if old not in s:
              raise SystemExit('Target nomenclature not found; aborting without changes.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manajemen-puskesmas.html
          git rm .github/workflows/fix-batang-pinang.yml
          git commit -m 'fix: standardize Batang Pinang naming'
          git push
