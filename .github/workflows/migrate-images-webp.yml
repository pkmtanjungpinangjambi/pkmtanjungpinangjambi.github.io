name: Migrate local images to WebP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  webp-migration:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install WebP tools
        run: |
          sudo apt-get update
          sudo apt-get install -y webp

      - name: Convert local raster images to WebP
        shell: bash
        run: |
          set -euo pipefail
          converted=0
          while IFS= read -r -d '' p; do
            out="${p%.*}.webp"
            [ -f "$out" ] && continue
            case "${p##*.}" in
              jpg|JPG|jpeg|JPEG) cwebp -quiet -q 85 "$p" -o "$out" ;;
              png|PNG) cwebp -quiet -lossless "$p" -o "$out" ;;
            esac
            converted=$((converted + 1))
          done < <(find . -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' \) -not -path './.git/*' -print0)
          echo "Converted $converted image(s)"

      - name: Update local image references
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('.')
          skip={'.git','node_modules','.venv'}
          exts={'.html','.htm','.css','.js','.json','.md','.xml','.txt'}
          pat=re.compile(r'(?<![A-Za-z0-9_./:-])(\S+?)\.(jpg|jpeg|png)(?=["\'\)\s>#?,]|$)',re.I)
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in exts or any(x in skip for x in p.parts): continue
              try: s=p.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              def repl(m):
                  token=m.group(1)
                  if token.startswith(('http://','https://','//','data:')): return m.group(0)
                  return token+'.webp'
              ns=pat.sub(repl,s)
              if ns!=s: p.write_text(ns,encoding='utf-8')
          PY

      - name: Validate WebP references
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,sys
          root=Path('.')
          skip={'.git','node_modules','.venv'}
          exts={'.html','.htm','.css','.js','.json','.md','.xml','.txt'}
          pat=re.compile(r'(?<![A-Za-z0-9_./:-])([^\s"\'\)<>#?,]+\.webp)(?=["\'\)\s<>#?,]|$)',re.I)
          bad=[]
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in exts or any(x in skip for x in p.parts): continue
              try: s=p.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              for ref in pat.findall(s):
                  if ref.startswith(('http://','https://','//','data:')): continue
                  clean=ref.split('?',1)[0].split('#',1)[0]
                  if not ((p.parent/clean).exists() or (root/clean).exists()): bad.append(f'{p}: {ref}')
          if bad: print('\n'.join(bad)); sys.exit(1)
          print('PASS: all local WebP references resolve')
          PY

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No image migration changes required."; exit 0; fi
          git commit -m "perf: migrate local images to webp"
          git push origin HEAD:work/audit-informasi-p0-p1-2026-08-31
