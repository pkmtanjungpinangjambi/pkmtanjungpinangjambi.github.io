name: Normalize CKG 2026

on:
  push:
    branches:
      - work/ckg-reference-2026-09-01

permissions:
  contents: write

jobs:
  normalize-ckg:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update CKG public guidance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('pelayanan-ckg.html')
          s = p.read_text(encoding='utf-8')
          old = '<p>Ketentuan program termasuk jadwal dan persyaratan mengikuti petunjuk teknis CKG yang berlaku.</p>'
          new = '<p>CKG balita dan anak prasekolah usia 1–6 tahun, dewasa usia 18–59 tahun, dan lansia usia 60 tahun ke atas dilaksanakan setahun sekali. CKG usia sekolah dan remaja usia 7–17 tahun mengikuti Petunjuk Teknis CKG Sekolah.</p>'
          if old not in s:
              raise SystemExit('TARGET_ALUR_NOT_FOUND')
          s = s.replace(old, new, 1)
          old2 = '<div class="service-note"><strong>Catatan:</strong> Paket pemeriksaan dan sasaran CKG mengikuti ketentuan program terbaru yang berlaku.</div>'
          new2 = '<div class="service-note"><strong>Catatan:</strong> CKG mencakup seluruh siklus hidup. Bayi baru lahir memiliki jadwal khusus; usia sekolah dan remaja mengikuti CKG Sekolah. Untuk balita/prasekolah, dewasa, dan lansia, CKG dilaksanakan setahun sekali sesuai Juknis 2026.</div>'
          if old2 not in s:
              raise SystemExit('TARGET_NOTE_NOT_FOUND')
          s = s.replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate CKG update
        run: |
          grep -F 'usia 1–6 tahun' pelayanan-ckg.html
          grep -F 'usia 18–59 tahun' pelayanan-ckg.html
          grep -F 'usia 60 tahun ke atas' pelayanan-ckg.html
          grep -F 'usia 7–17 tahun' pelayanan-ckg.html
          echo CKG_VALIDATION_PASS
      - name: Commit CKG update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pelayanan-ckg.html
          git commit -m 'ref: clarify CKG 2026 age groups and annual frequency'
          git push
