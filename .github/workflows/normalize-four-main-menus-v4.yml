name: Normalize four primary menus v4

on:
  push:
    branches:
      - feature/manajemen-puskesmas-cluster-1-clean

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, 'refactor: normalize sitewide four-menu navigation') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize all HTML navigation blocks
        shell: python
        run: |
          from pathlib import Path
          import re

          def active_for(name: str) -> str:
              if name == 'index.html':
                  return 'home'
              if name.startswith('profil') or name == 'struktur.html':
                  return 'profil'
              if name == 'pelayanan.html' or name.startswith('pelayanan-') or name == 'manajemen-puskesmas.html' or name in {'jadwal.html','tarif.html'}:
                  return 'pelayanan'
              return 'informasi'

          def nav_html(active: str, cta: str) -> str:
              def cls(x):
                  return ' class="active"' if x == active else ''
              return f'''<nav class="nav" aria-label="Navigasi utama">\n<a href="index.html"{cls('home')}>Beranda</a>\n<div class="nav-item-dropdown"><a href="profil.html"{cls('profil')}>Profil</a><button type="button" class="dropdown-caret-btn" aria-label="Buka submenu Profil" aria-expanded="false">▾</button><div class="dropdown-menu"><a href="profil.html#sejarah">Sejarah</a><a href="profil.html#visi-misi">Visi &amp; Misi</a><a href="profil.html#motto-tata-nilai">Motto &amp; Tata Nilai</a><a href="profil.html#karakter">Karakteristik &amp; Kekuatan</a></div></div>\n<div class="nav-item-dropdown"><a href="pelayanan.html"{cls('pelayanan')}>Pelayanan</a><button type="button" class="dropdown-caret-btn" aria-label="Buka submenu Pelayanan" aria-expanded="false">▾</button><div class="dropdown-menu"><a href="pelayanan.html#klaster-1">Klaster 1 — Manajemen</a><a href="manajemen-puskesmas.html">Manajemen Puskesmas</a><a href="pelayanan.html#klaster-2">Klaster 2 — Ibu &amp; Anak</a><a href="pelayanan.html#klaster-3">Klaster 3 — Dewasa &amp; Lansia</a><a href="pelayanan.html#klaster-4">Klaster 4 — Penyakit Menular</a><a href="pelayanan.html#klaster-5">Klaster 5 — Lintas Klaster</a></div></div>\n<div class="nav-item-dropdown"><a href="informasi.html"{cls('informasi')}>Informasi</a><button type="button" class="dropdown-caret-btn" aria-label="Buka submenu Informasi" aria-expanded="false">▾</button><div class="dropdown-menu"><a href="index.html#pengumuman">Pengumuman</a><a href="index.html#berita">Berita &amp; Kegiatan</a><a href="informasi.html">Galeri Foto &amp; Video</a><a href="edukasi.html">Edukasi</a><a href="program.html">Program &amp; Inovasi</a><a href="index.html#ilp">Informasi ILP</a><a href="download.html">Download</a><a href="kontak.html">Kontak &amp; Lokasi</a></div></div>\n{cta}\n</nav>'''

          changed=[]
          for path in sorted(Path('.').glob('*.html')):
              raw=path.read_text(encoding='utf-8')
              m=re.search(r'<nav class="nav"[^>]*>.*?</nav>', raw, flags=re.S)
              if not m:
                  continue
              old=m.group(0)
              cta_match=re.search(r'<a\s+class="nav-cta"\b[^>]*>.*?</a>', old, flags=re.S)
              cta=cta_match.group(0) if cta_match else '<a class="nav-cta" href="https://wa.me/6282180622274" target="_blank" rel="noopener">WhatsApp</a>'
              new=nav_html(active_for(path.name), cta)
              if new != old:
                  path.write_text(raw[:m.start()]+new+raw[m.end():], encoding='utf-8')
                  changed.append(path.name)
          print('Changed:', len(changed))
          for p in changed:
              print(p)

      - name: Commit sitewide navigation normalization
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo "No navigation changes required."
            exit 0
          fi
          git commit -m "refactor: normalize sitewide four-menu navigation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
