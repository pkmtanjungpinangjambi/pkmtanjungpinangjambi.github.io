name: Normalize four primary navigation menus

on:
  push:
    branches:
      - feature/manajemen-puskesmas-cluster-1-clean

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, 'refactor: keep four primary navigation menus') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize navigation without reformatting files
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')

          def remove_top_level_nav_item(text: bytes, href: bytes) -> bytes:
              # Remove a top-level dropdown whose first link targets href.
              dropdown = re.compile(
                  rb'<div class="nav-item-dropdown">\s*<a href="' + re.escape(href) +
                  rb'">.*?</div>\s*</div>', re.S
              )
              text = dropdown.sub(b'', text, count=1)
              # Remove a simple top-level anchor targeting href.
              anchor = re.compile(rb'<a(?:\s+[^>]*?)?\s+href="' + re.escape(href) + rb'"[^>]*>.*?</a>', re.S)
              return anchor.sub(b'', text, count=1)

          def extract_top_level_dropdown(text: bytes, href: bytes):
              pat = re.compile(
                  rb'<div class="nav-item-dropdown">\s*<a href="' + re.escape(href) +
                  rb'">.*?</a>.*?<div class="dropdown-menu">.*?</div>\s*</div>', re.S
              )
              m = pat.search(text)
              return (m.group(0), m) if m else (b'', None)

          def add_to_pelayanan_dropdown(text: bytes, label: bytes, href: bytes) -> bytes:
              # Prefer a cluster-1 position; otherwise add at the start of the menu.
              item = b'<a href="' + href + b'">' + label + b'</a>'
              pelayanan = re.compile(
                  rb'(<div class="nav-item-dropdown">\s*<a(?:\s+[^>]*?)?\s+href="pelayanan\.html"[^>]*>.*?</a>.*?<div class="dropdown-menu">)(.*?)(</div>\s*</div>)',
                  re.S,
              )
              m = pelayanan.search(text)
              if not m:
                  return text
              menu = m.group(2)
              if href in menu:
                  return text
              cluster1 = re.search(rb'(?=<a href="pelayanan\.html#klaster-1")', menu)
              if cluster1:
                  menu2 = menu[:cluster1.start()] + item + menu[cluster1.start():]
              else:
                  menu2 = item + menu
              return text[:m.start(2)] + menu2 + text[m.end(2):]

          def normalize_nav(text: bytes) -> bytes:
              # 1) Remove top-level Management dropdown/link.
              management_dropdown, management_match = extract_top_level_dropdown(text, b'manajemen-puskesmas.html')
              if management_match:
                  text = text[:management_match.start()] + text[management_match.end():]
              else:
                  text = remove_top_level_nav_item(text, b'manajemen-puskesmas.html')

              # 2) Move top-level Tariff into the Pelayanan dropdown when present.
              tariff_top = re.search(
                  rb'<a href="tarif\.html">Tarif Pelayanan</a>', text
              )
              if tariff_top:
                  text = text[:tariff_top.start()] + text[tariff_top.end():]
                  text = add_to_pelayanan_dropdown(text, b'Tarif Pelayanan', b'tarif.html')

              # 3) Put Management into Pelayanan dropdown when that dropdown exists.
              text = add_to_pelayanan_dropdown(text, b'Manajemen Puskesmas', b'manajemen-puskesmas.html')

              # 4) Simple/detail-page navigation: leave exactly four primary links.
              nav_match = re.search(rb'<nav class="nav"(?:\s+[^>]*)?>.*?</nav>', text, re.S)
              if nav_match and b'manajemen-puskesmas.html' not in text[nav_match.start():nav_match.end()]:
                  nav = nav_match.group(0)
                  # Remove extra simple top-level links that are not among the four primary menus/CTA.
                  for href in (b'jadwal.html', b'tarif.html', b'kontak.html'):
                      nav = re.sub(
                          rb'<a(?:\s+[^>]*?)?\s+href="' + re.escape(href) + rb'"[^>]*>.*?</a>', b'', nav, count=1, flags=re.S
                      )
                  text = text[:nav_match.start()] + nav + text[nav_match.end():]

              return text

          changed = []
          for path in sorted(root.glob('*.html')):
              raw = path.read_bytes()
              new = normalize_nav(raw)
              if new != raw:
                  path.write_bytes(new)
                  changed.append(str(path))

          print('Changed files:', len(changed))
          for item in changed:
              print(item)

      - name: Commit normalized navigation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo "No navigation changes required."
            exit 0
          fi
          git commit -m "refactor: keep four primary navigation menus"
          git push origin "HEAD:${GITHUB_REF_NAME}"
