name: Normalize Information Navigation

on:
  push:
    branches:
      - work/information-nav-final-2026-09-01

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize Information page navigation
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          canonical = '''<nav class="nav"><a href="index.html">Beranda</a><div class="nav-item-dropdown"><a href="profil.html">Profil</a><button type="button" class="dropdown-caret-btn" aria-label="Buka submenu Profil" aria-expanded="false">▾</button><div class="dropdown-menu"><a href="profil.html#sejarah">Sejarah</a><a href="profil.html#visi-misi">Visi &amp; Misi</a><a href="profil.html#motto-tata-nilai">Motto &amp; Tata Nilai</a><a href="profil.html#karakter">Karakteristik &amp; Kekuatan</a></div></div><div class="nav-item-dropdown"><a href="pelayanan.html">Pelayanan</a><button type="button" class="dropdown-caret-btn" aria-label="Buka submenu Pelayanan" aria-expanded="false">▾</button><div class="dropdown-menu"><a href="pelayanan.html#klaster-1">Klaster 1 — Manajemen</a><a href="pelayanan.html#klaster-2">Klaster 2 — Ibu &amp; Anak</a><a href="pelayanan.html#klaster-3">Klaster 3 — Dewasa &amp; Lansia</a><a href="pelayanan.html#klaster-4">Klaster 4 — Penyakit Menular</a><a href="pelayanan.html#klaster-5">Klaster 5 — Lintas Klaster</a></div></div><div class="nav-item-dropdown"><a class="active" href="informasi.html">Informasi</a><button type="button" class="dropdown-caret-btn" aria-label="Buka submenu Informasi" aria-expanded="false">▾</button><div class="dropdown-menu"><a href="index.html#pengumuman">Pengumuman</a><a href="index.html#berita">Berita &amp; Kegiatan</a><a href="informasi.html">Galeri Foto &amp; Video</a><a href="edukasi.html">Edukasi</a><a href="program.html">Program &amp; Inovasi</a><a href="index.html#ilp">Informasi ILP</a><a href="download.html">Download</a><a href="kontak.html">Kontak &amp; Lokasi</a></div></div><a class="nav-cta" href="https://wa.me/6282180622274" target="_blank" rel="noopener">WhatsApp</a></nav>'''
          for name in ['informasi.html','edukasi.html','program.html','download.html']:
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              new, n = re.subn(r'<nav class="nav">.*?</nav>', canonical, s, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f'NAV_NOT_FOUND:{name}')
              p.write_text(new, encoding='utf-8')
          PY
      - name: Validate Information navigation
        run: |
          for f in informasi.html edukasi.html program.html download.html; do
            grep -F 'Klaster 1 — Manajemen' "$f" >/dev/null
            grep -F 'Klaster 5 — Lintas Klaster' "$f" >/dev/null
            ! grep -F 'Tarif Pelayanan' "$f" >/dev/null || exit 1
            ! grep -F 'Keluhan &amp; Pengaduan' "$f" >/dev/null || exit 1
          done
          echo INFORMATION_NAV_VALIDATION_PASS
      - name: Commit normalization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add informasi.html edukasi.html program.html download.html
          git commit -m 'fix: normalize static navigation on information pages'
          git push
