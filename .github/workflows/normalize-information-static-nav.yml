name: Normalize Information Static Nav

on:
  push:
    branches:
      - work/information-static-nav-fix-2026-09-01

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, '[static-nav]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize static Information navigation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [Path('informasi.html'), Path('edukasi.html'), Path('program.html'), Path('download.html')]
          changed = []
          for path in files:
              text = path.read_text(encoding='utf-8')
              nav_start = text.find('<nav class="nav"')
              nav_end = text.find('</nav>', nav_start)
              if nav_start < 0 or nav_end < 0:
                  raise SystemExit(f'NAV_NOT_FOUND: {path}')
              nav = text[nav_start:nav_end]
              old = '<div class="nav-item-dropdown"><a href="manajemen-puskesmas.html">Manajemen Puskesmas</a><button type="button" class="dropdown-caret-btn" aria-label="Buka submenu Manajemen Puskesmas" aria-expanded="false">▾</button><div class="dropdown-menu"><a href="manajemen-puskesmas.html#ketatausahaan">Ketatausahaan &amp; Layanan Administrasi</a><a href="manajemen-puskesmas.html#sumber-daya">Manajemen Sumber Daya</a><a href="manajemen-puskesmas.html#manajemen-puskesmas">Manajemen Puskesmas</a><a href="manajemen-puskesmas.html#mutu-keselamatan">Mutu &amp; Keselamatan Pasien</a><a href="manajemen-puskesmas.html#jejaring">Manajemen Jejaring</a><a href="manajemen-puskesmas.html#pemberdayaan">Pemberdayaan Masyarakat</a><a href="manajemen-puskesmas.html#struktur">Struktur Organisasi</a><a href="manajemen-puskesmas.html#standar-klaster-1">Standar Pelayanan Klaster 1</a></div></div>'
              if old in nav:
                  nav = nav.replace(old, '', 1)
              elif 'Manajemen Puskesmas</a><button' in nav:
                  raise SystemExit(f'LEGACY_MANAGEMENT_NAV_VARIANT: {path}')
              pstart = nav.find('<div class="nav-item-dropdown"><a href="pelayanan.html"')
              pend = nav.find('</div></div>', pstart)
              if pstart < 0 or pend < 0:
                  raise SystemExit(f'PELAYANAN_NAV_NOT_FOUND: {path}')
              pblock = nav[pstart:pend+len('</div></div>')]
              if 'href="manajemen-puskesmas.html"' not in pblock:
                  pblock = pblock.replace('<div class="dropdown-menu">', '<div class="dropdown-menu"><a href="manajemen-puskesmas.html">Klaster 1 — Manajemen</a>', 1)
                  nav = nav[:pstart] + pblock + nav[pend+len('</div></div>'):]
              new_text = text[:nav_start] + nav + text[nav_end:]
              if new_text != text:
                  path.write_text(new_text, encoding='utf-8')
                  changed.append(str(path))
          if changed:
              print('CHANGED:', ', '.join(changed))
          else:
              print('NO_CHANGES')
          PY
      - name: Commit normalization
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add informasi.html edukasi.html program.html download.html
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m "fix: normalize Information static navigation [static-nav]"
          git push
