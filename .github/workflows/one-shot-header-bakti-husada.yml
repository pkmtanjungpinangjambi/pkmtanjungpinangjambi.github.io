name: One-shot Header Bakti Husada

on:
  push:
    branches:
      - fix/header-bakti-husada-clean-20260904

permissions:
  contents: write

jobs:
  normalize-header:
    if: ${{ !contains(github.event.head_commit.message, '[header-normalized]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Download official Bakti Husada emblem
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/culture
          curl -fsSL --retry 3 --connect-timeout 15 \
            -o assets/culture/bakti-husada-1984.png \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/Lambang%20Kemkes.png'
          file assets/culture/bakti-husada-1984.png

      - name: Apply sitewide header CSS
        shell: bash
        run: |
          set -euo pipefail
          cat >> styles.css <<'CSS'

/* SITEWIDE — institutional header with official Bakti Husada emblem */
.site-header .brand{align-items:center!important;gap:10px!important;max-width:min(720px,60vw)!important}
.site-header .brand strong{display:flex!important;align-items:center!important;gap:9px!important;min-width:0!important;margin:0!important;padding:0!important;font-size:0!important;line-height:1.1!important;color:transparent!important;white-space:nowrap!important}
.site-header .brand strong::before{content:"UPTD PUSKESMAS TANJUNG PINANG JAMBI";display:inline-block;color:var(--green-900)!important;font-size:.88rem;font-weight:900;letter-spacing:.01em;white-space:nowrap}
.site-header .brand strong::after{content:"";display:inline-block;flex:0 0 auto;width:34px;height:42px;background:url("assets/culture/bakti-husada-1984.png") center/contain no-repeat}
.site-header .brand small{display:block!important;margin:0!important;color:var(--muted)!important;font-size:.68rem!important;line-height:1.2!important;white-space:nowrap}
@media(max-width:1180px){.site-header .brand{max-width:500px!important}.site-header .brand strong::before{font-size:.76rem}.site-header .brand strong::after{width:30px;height:38px}}
@media(max-width:900px){.site-header .brand{max-width:none!important;flex:1 1 auto}.site-header .brand strong{white-space:normal!important;flex-wrap:wrap!important}.site-header .brand strong::before{font-size:.72rem;white-space:normal}.site-header .brand strong::after{width:26px;height:34px}.site-header .brand small{font-size:.60rem!important}}
@media(max-width:600px){.site-header .brand{gap:7px!important}.site-header .brand strong{gap:6px!important}.site-header .brand strong::before{font-size:.66rem}.site-header .brand strong::after{width:23px;height:30px}.site-header .brand small{font-size:.55rem!important}}
CSS

      - name: Verify no prohibited header substitutions
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/culture/bakti-husada-1984.png
          grep -q 'UPTD PUSKESMAS TANJUNG PINANG JAMBI' styles.css
          grep -q 'bakti-husada-1984.png' styles.css

      - name: Commit normalized header
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add styles.css assets/culture/bakti-husada-1984.png
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'fix: standardize institutional header with Bakti Husada [header-normalized]'
          git push
