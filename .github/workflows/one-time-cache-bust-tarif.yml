name: One-time cache bust tarif

on:
  push:
    branches:
      - fix/cache-bust-tarif-20260906

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Bump tariff cache version
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("tarif.html")
          s = p.read_text(encoding="utf-8")
          old = 'styles.css?v=20260824-info1'
          new = 'styles.css?v=20260906-tariff2'
          if old not in s:
              raise SystemExit("expected cache version not found")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Verify no specialist tariff remains
        run: |
          if grep -Fqi 'Spesialis' tarif.html; then
            echo 'Specialist text still present in tarif.html'
            exit 1
          fi
          grep -Fq 'styles.css?v=20260906-tariff2' tarif.html

      - name: Commit patch and remove workflow
        run: |
          git config user.name 'UPTD Puskesmas Tanjung Pinang Kota Jambi'
          git config user.email '313901015+pkmtanjungpinangjambi@users.noreply.github.com'
          git add tarif.html
          git rm .github/workflows/one-time-cache-bust-tarif.yml
          git commit -m 'chore: bust tariff page cache'
          git push origin HEAD:${GITHUB_REF_NAME}
