name: One-time management architecture migration

on:
  push:
    branches:
      - feature/manajemen-puskesmas-cluster-1-clean

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[management-architecture-autopatch]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.ref_name }}

      - name: Migrate architecture without line-ending churn
        shell: python
        run: |
          from pathlib import Path
          import re

          MANAGEMENT_NAV = '''<div class="nav-item-dropdown"><a href="manajemen-puskesmas.html">Manajemen Puskesmas</a><button type="button" class="dropdown-caret-btn" aria-label="Buka submenu Manajemen Puskesmas" aria-expanded="false">▾</button><div class="dropdown-menu"><a href="manajemen-puskesmas.html#ketatausahaan">Ketatausahaan &amp; Layanan Administrasi</a><a href="manajemen-puskesmas.html#sumber-daya">Manajemen Sumber Daya</a><a href="manajemen-puskesmas.html#manajemen-puskesmas">Manajemen Puskesmas</a><a href="manajemen-puskesmas.html#mutu-keselamatan">Mutu &amp; Keselamatan Pasien</a><a href="manajemen-puskesmas.html#jejaring">Manajemen Jejaring</a><a href="manajemen-puskesmas.html#pemberdayaan">Pemberdayaan Masyarakat</a><a href="manajemen-puskesmas.html#struktur">Struktur Organisasi</a><a href="manajemen-puskesmas.html#standar-klaster-1">Standar Pelayanan Klaster 1</a></div></div>'''

          def text_of(path: Path) -> str:
              return path.read_bytes().decode('utf-8')

          def save(path: Path, text: str) -> None:
              # UTF-8 bytes preserve the file's existing CRLF/LF characters exactly.
              path.write_bytes(text.encode('utf-8'))

          def remove_details(text: str, start_marker: str, path_name: str) -> str:
              start = text.find(start_marker)
              if start < 0:
                  return text
              token_re = re.compile(r'</?details\b', re.I)
              pos = start
              depth = 0
              first = True
              while True:
                  match = token_re.search(text, pos)
                  if not match:
                      raise RuntimeError(f'Could not find matching </details> for {path_name}')
                  if text[match.start()+1] != '/':
                      depth += 1
                  else:
                      depth -= 1
                      if not first and depth == 0:
                          close_end = text.find('>', match.end())
                          if close_end < 0:
                              raise RuntimeError(f'Malformed details close in {path_name}')
                          return text[:start] + text[close_end + 1:]
                  first = False
                  pos = match.end()

          changed = []
          warnings = []

          html_files = sorted(Path('.').glob('*.html'))
          for path in html_files:
              if path.name == 'manajemen-puskesmas.html':
                  continue

              original = text_of(path)
              text = original

              # Remove old Profile navigation/content reference to Klaster 1.
              text = re.sub(r'\n\s*<a href="profil\.html#klaster1">.*?</a>\s*', '\n', text, flags=re.S)
              text = re.sub(r'\n\s*<button\s+data-tab="klaster1">.*?</button>\s*', '\n', text, flags=re.S)

              if 'href="manajemen-puskesmas.html"' not in text:
                  nav_pat = re.compile(r'(<div class="nav-item-dropdown">\s*<a[^>]+href="pelayanan\.html"[^>]*>Pelayanan</a>)', re.S)
                  text, inserted = nav_pat.subn(MANAGEMENT_NAV + r'\1', text, count=1)
                  if inserted == 0 and '<nav' in text:
                      warnings.append(f'Navigation target not found: {path.name}')

              # Move all legacy direct references to the new management page.
              text = text.replace('pelayanan.html#klaster-1', 'manajemen-puskesmas.html#standar-klaster-1')

              if path.name == 'profil.html':
                  marker = '<!-- =======================================================\n     4. KLASTER 1 — MANAJEMEN\n     ======================================================= -->'
                  boundary = '<!-- =======================================================\n     5. KARAKTERISTIK & KEKUATAN'
                  if marker in text and boundary in text:
                      start = text.index(marker)
                      end = text.index(boundary, start)
                      text = text[:start] + text[end:]
                  text = text.replace(', Klaster 1 Manajemen', '')
                  text = text.replace('Klaster 1 — Manajemen, ', '')
                  text = text.replace('sistem manajemen,', 'tata kelola dan pelayanan,')

              elif path.name == 'pelayanan.html':
                  cluster_marker = '<details class="cluster cluster-1" id="klaster-1"'
                  text = remove_details(text, cluster_marker, path.name)
                  text = text.replace(
                      'Pelayanan UPTD Puskesmas Tanjung Pinang disusun dalam 5 klaster agar masyarakat lebih mudah menemukan layanan yang dibutuhkan.',
                      'Pelayanan kesehatan masyarakat ditampilkan dalam Klaster 2–5. Klaster 1 — Manajemen berada pada menu utama Manajemen Puskesmas agar informasi manajemen dan layanan administrasi tidak bercampur.'
                  )
                  text = text.replace('<span class="kicker">5 KLASTER PELAYANAN</span>', '<span class="kicker">KLASTER 2–5</span>')
                  text = text.replace('Nomenklatur klaster dibuat seragam dengan struktur Profil Puskesmas.', 'Nomenklatur klaster mengikuti struktur Integrasi Layanan Primer dan Standar Pelayanan Puskesmas.')
                  note = '<div class="service-note" style="max-width:850px;margin:0 auto 22px"><strong>Klaster 1 — Manajemen:</strong> informasi manajemen Puskesmas dan standar pelayanan administrasi tersedia di menu <a href="manajemen-puskesmas.html#standar-klaster-1"><strong>Manajemen Puskesmas</strong> →</a></div>\n'
                  if 'Klaster 1 — Manajemen:</strong> informasi manajemen' not in text:
                      text = text.replace('<div class="cluster-list">', note + '<div class="cluster-list">', 1)
                  text = text.replace("/^#klaster-([1-5])$/", "/^#klaster-([2-5])$/")

              if text != original:
                  save(path, text)
                  changed.append(path.name)

          sitemap = Path('sitemap.xml')
          if sitemap.exists():
              original = text_of(sitemap)
              if 'manajemen-puskesmas.html' not in original:
                  text = original.replace('</urlset>', '  <url><loc>https://pkmtanjungpinangjambi.vercel.app/manajemen-puskesmas.html</loc></url>\n</urlset>')
                  save(sitemap, text)
                  changed.append('sitemap.xml')

          # Final guard: every HTML page with a nav must expose the main management entry.
          for path in sorted(Path('.').glob('*.html')):
              text = text_of(path)
              if '<nav' in text and 'href="manajemen-puskesmas.html"' not in text:
                  warnings.append(f'Missing management nav after migration: {path.name}')

          # Profile must no longer contain the old top-level Klaster 1 section.
          profile_text = text_of(Path('profil.html'))
          if 'id="klaster1"' in profile_text or 'data-tab="klaster1"' in profile_text:
              raise RuntimeError('Profile still contains legacy Klaster 1 tab/section')

          # Pelayanan must no longer contain the Klaster 1 accordion.
          pelayanan_text = text_of(Path('pelayanan.html'))
          if 'id="klaster-1"' in pelayanan_text:
              raise RuntimeError('Pelayanan still contains legacy Klaster 1 accordion')

          if warnings:
              print('\n'.join(warnings))
              raise SystemExit('Migration completed with navigation warnings; refusing to commit.')

          if not changed:
              raise SystemExit('No files changed.')

          print(f'Changed {len(changed)} files:')
          for item in changed:
              print(' -', item)

      - name: Validate HTML and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          class Parser(HTMLParser):
              pass
          for path in sorted(Path('.').glob('*.html')):
              text = path.read_text(encoding='utf-8')
              Parser().feed(text)
              assert '</html>' in text.lower(), f'Missing </html>: {path}'
              print(f'HTML parse check OK: {path}')
          PY
          node --check content-protection.js
          node --check script.js

      - name: Commit migration and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-time-management-architecture.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'feat: promote Manajemen Puskesmas to main navigation [management-architecture-autopatch]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
