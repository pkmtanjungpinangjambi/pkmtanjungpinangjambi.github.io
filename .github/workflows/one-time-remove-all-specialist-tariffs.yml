name: One-time remove all specialist tariffs

on:
  push:
    branches:
      - fix/remove-all-specialist-tariffs-20260906

permissions:
  contents: write

jobs:
  patch-tariff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove remaining specialist tariff rows and repair array
        shell: python
        run: |
          from pathlib import Path

          path = Path("tarif.html")
          text = path.read_text(encoding="utf-8")

          targets = [
              '    ["Persalinan Normal — Dokter Spesialis","Rp 1.200.000","Persalinan"],\n',
              '    ["Persalinan dengan Penyulit — Dokter Spesialis","Rp 1.500.000","Persalinan"],\n',
          ]

          for target in targets:
              if target not in text:
                  raise SystemExit(f"Target specialist row not found: {target.strip()}")
              text = text.replace(target, "", 1)

          marker = '\n\nconst container = document.getElementById(\'tarifContainer\');'
          if marker not in text:
              raise SystemExit("Expected categories array terminator location not found.")

          text = text.replace(
              marker,
              '\n];\n\nconst container = document.getElementById(\'tarifContainer\');',
              1,
          )

          path.write_text(text, encoding="utf-8")

      - name: Verify specialist tariffs are gone and JavaScript array closes
        shell: python
        run: |
          from pathlib import Path

          text = Path("tarif.html").read_text(encoding="utf-8")
          start = text.index("const categories = [")
          end = text.index("const container", start)
          block = text[start:end]

          forbidden = [
              "Dokter Spesialis",
              "Pelayanan Spesialis",
              "Spesialis Anak",
              "Spesialis Kebidanan",
              "Konsultasi Spesialis",
          ]

          found = [item for item in forbidden if item in block]
          if found:
              raise SystemExit("Specialist text still present: " + ", ".join(found))

          if not block.rstrip().endswith("];" ):
              raise SystemExit("categories array is not terminated with ];")

      - name: Commit change and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tarif.html
          git rm .github/workflows/one-time-remove-all-specialist-tariffs.yml
          git commit -m 'fix: hapus seluruh tarif dokter spesialis'
          git push origin HEAD
