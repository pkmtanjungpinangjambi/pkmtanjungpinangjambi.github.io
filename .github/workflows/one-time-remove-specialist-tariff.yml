name: One-time remove specialist tariff items

on:
  push:
    branches:
      - fix/remove-specialist-tariff-20260906

permissions:
  contents: write

jobs:
  patch-tariff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove specialist tariff entries
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('tarif.html')
          text = path.read_text(encoding='utf-8')

          start = text.index('const categories = [')
          end = text.index('];', start)
          block = text[start:end + 2]
          lines = block.splitlines()

          out = []
          skip_category = False
          for line in lines:
              if re.match(r'^\\s*\\{\\s*title:', line):
                  skip_category = 'Spesialis' in line
                  if skip_category:
                      continue
                  out.append(line)
                  continue

              if skip_category:
                  if re.match(r'^\\s*\\},?\\s*$', line):
                      skip_category = False
                  continue

              if 'Spesialis' in line:
                  continue

              out.append(line)

          new_block = '\\n'.join(out)
          path.write_text(text[:start] + new_block + text[end + 2:], encoding='utf-8')

      - name: Verify no specialist tariff remains
        shell: bash
        run: |
          if grep -n 'Spesialis' tarif.html; then
            echo 'Specialist tariff entry still exists.'
            exit 1
          fi

      - name: Commit tariff change and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tarif.html
          git rm .github/workflows/one-time-remove-specialist-tariff.yml
          git commit -m 'fix: hapus tarif layanan spesialis'
          git push origin HEAD
