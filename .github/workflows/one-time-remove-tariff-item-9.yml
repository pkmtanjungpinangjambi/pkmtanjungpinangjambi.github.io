name: One-time remove tariff item 9

on:
  push:
    branches:
      - fix/remove-tariff-item-9-20260906

permissions:
  contents: write

jobs:
  patch-tariff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove tariff category 9
        shell: python
        run: |
          from pathlib import Path

          path = Path('tarif.html')
          text = path.read_text(encoding='utf-8')
          start = text.index('const categories = [')
          end = text.index('];', start)
          block = text[start:end + 2]
          lines = block.splitlines()

          out = []
          skip = False
          removed = False

          for line in lines:
              stripped = line.strip()
              if stripped.startswith('{ title: "9. Pelayanan Spesialis'):
                  skip = True
                  removed = True
                  continue
              if skip:
                  if stripped == '},' or stripped == '}':
                      skip = False
                  continue
              out.append(line)

          if not removed:
              raise SystemExit('Kategori 9 Pelayanan Spesialis tidak ditemukan; tidak ada perubahan dibuat.')

          new_block = '\n'.join(out)
          path.write_text(text[:start] + new_block + text[end + 2:], encoding='utf-8')

      - name: Verify category 9 is gone
        shell: bash
        run: |
          if grep -n '9. Pelayanan Spesialis' tarif.html; then
            echo 'Kategori 9 masih ada.'
            exit 1
          fi

      - name: Commit change and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tarif.html
          git rm .github/workflows/one-time-remove-tariff-item-9.yml
          git commit -m 'fix: hapus tarif kategori 9 spesialis'
          git push origin HEAD
