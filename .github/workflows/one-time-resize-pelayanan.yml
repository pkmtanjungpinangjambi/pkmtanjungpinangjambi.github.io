name: One-time compact Pelayanan

on:
  push:
    branches:
      - style/pelayanan-tautan-terkait-compact-20260906

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply compact Pelayanan layout
        shell: python
        run: |
          from pathlib import Path

          path = Path("pelayanan.html")
          text = path.read_text(encoding="utf-8")

          for i in range(1, 6):
              old = f"Informasi Pelayanan Klaster {i}"
              new = f"Tautan Terkait · Klaster {i}"
              if old not in text:
                  raise SystemExit(f"Target label not found: {old}")
              text = text.replace(old, new, 1)

          marker = "</style>"
          if marker not in text:
              raise SystemExit("Inline style marker not found")

          override = r'''
/* PELAYANAN — compact visual + related-links treatment */
.cluster-banner{max-width:460px}
.cluster summary{grid-template-columns:minmax(230px,460px) minmax(0,1fr) 32px;padding:15px 18px;gap:15px}
.cluster-list{gap:15px;margin-top:24px}
.cluster-body{padding:0 20px 20px}
.service-grid{gap:10px;margin-top:15px}
.service-link{gap:10px;padding:13px}
.service-index{width:28px;height:28px;flex-basis:28px;font-size:.72rem}
.service-link strong{font-size:.88rem}
.service-link span{font-size:.72rem}
.cluster-support{margin-top:16px;padding:12px}
.cluster-support-title{font-size:.76rem;margin-bottom:8px}
.support-item summary{padding:9px 8px;font-size:.72rem;gap:5px}
.support-item summary::after{width:18px;height:18px;font-size:12px;flex-basis:18px}
.support-body{padding:9px 10px 10px;font-size:.72rem}
@media(max-width:760px){
  .cluster summary{padding:14px 52px 14px 14px}
  .cluster-body{padding:0 15px 15px}
  .cluster-banner{max-width:none}
}
'''

          text = text.replace(marker, override + marker, 1)
          path.write_text(text, encoding="utf-8")

      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-time-resize-pelayanan.yml
          git add pelayanan.html .github/workflows/one-time-resize-pelayanan.yml
          git diff --cached --quiet && { echo "No changes detected"; exit 1; }
          git commit -m "style: compact pelayanan and related links"
          git push