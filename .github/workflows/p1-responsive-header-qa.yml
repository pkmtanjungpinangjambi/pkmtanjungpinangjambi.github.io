name: P1 Responsive Header QA

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p1-responsive-header-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_URL: https://pkmtanjungpinangjambi.vercel.app

jobs:
  responsive-header:
    name: Responsive header / navigation
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Stage master header migration
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/header-master-batch-20260909'
        shell: python
        run: |
          from pathlib import Path
          import re

          repo = Path('.')
          pages = {
              'jadwal.html': None,
              'tarif.html': None,
              'kontak.html': 'Informasi',
              'manajemen-puskesmas.html': None,
          }

          def master_header(active=None):
              profile_active = ' class="active"' if active == 'Profil' else ''
              pelayanan_active = ' class="active"' if active == 'Pelayanan' else ''
              informasi_active = ' class="active"' if active == 'Informasi' else ''
              return f'''<div class="topbar"><div class="container topbar-inner"><span>📍 Jl. Taruma Negara No. 50, Kel. Tanjung Pinang, Kec. Jambi Timur, Kota Jambi</span><span><a href="tel:07417555394">📞 (0741) 7555394</a> · <a href="mailto:pkmtanjungpinang18jambi@gmail.com">✉️ Email</a></span><span class="topbar-social"><a href="https://www.instagram.com/pkm.tanjungpinang.jambi" target="_blank" rel="noopener noreferrer" aria-label="Instagram"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1.1" fill="#fff" stroke="none"/></svg></a><a href="https://web.facebook.com/kiki.ayu.98229" target="_blank" rel="noopener noreferrer" aria-label="Facebook"><svg width="13" height="13" viewBox="0 0 24 24" fill="#fff"><path d="M13.5 22v-8h2.7l.4-3.2h-3.1V8.7c0-.9.3-1.6 1.6-1.6h1.7V4.2c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.3v2.4H7.4V14h2.7v8h3.4z"/></svg></a><a href="https://wa.me/6282180622274" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp"><svg width="13" height="13" viewBox="0 0 32 32" fill="#fff"><path d="M16 3C9.4 3 4 8.3 4 14.9c0 2.6.8 5 2.3 7L4 29l7.3-2.3c1.9 1 4 1.6 6.2 1.6h.5c6.6 0 12-5.3 12-11.9C30 8.3 22.6 3 16 3zm5.9 15.1c-.3.8-1.7 1.6-2.4 1.7-.6.1-1.4.1-2.2-.1-.5-.2-1.2-.4-2-.8-3.5-1.5-5.8-5-6-5.3-.2-.2-1.4-1.9-1.4-3.6-.2-1.7.9-2.6 1.2-2.9.3-.3.7-.4 1 .6.3.8 1.1 2.6 1.2 2.8.1.2.1.4 0 .6-.3.6-.7 1.2-1 1.5-.2.2-.4.5-.2.8.2.4.9 1.5 2 2.4 1.4 1.2 2.5 1.6 2.9 1.8.4.2.6.1.8-.1l1.2-1.4c.3-.3.5-.2.9-.1l2.5 1.2c.4.2.6.3.7.5.1.2.1.9-.2 1.8z"/></svg></a></span></div></div>
<header class="site-header"><div class="container nav-wrap">
<a class="brand" href="index.html" aria-label="Beranda UPTD Puskesmas Tanjung Pinang"><span class="brand-mark"><img src="logo-pkm-baru.png" alt="Identitas UPTD Puskesmas Tanjung Pinang dan Dinas Kesehatan Kota Jambi" style="width:100%;height:100%;object-fit:contain"></span><span><strong>UPTD PUSKESMAS<br>TANJUNG PINANG</strong><small>Dinas Kesehatan Kota Jambi</small></span></a>
<button class="nav-toggle" type="button" aria-label="Buka menu" aria-expanded="false">☰</button>
<nav class="nav" aria-label="Navigasi utama"><a href="index.html">Beranda</a><div class="nav-item-dropdown"><a{profile_active} href="profil.html">Profil</a><button type="button" class="dropdown-caret-btn" aria-label="Buka submenu Profil" aria-expanded="false">▾</button><div class="dropdown-menu"><a href="profil.html#sejarah">Sejarah</a><a href="profil.html#visi-misi">Visi &amp; Misi</a><a href="profil.html#motto-tata-nilai">Motto &amp; Tata Nilai</a><a href="profil.html#karakter">Karakteristik &amp; Kekuatan</a></div></div><div class="nav-item-dropdown"><a{pelayanan_active} href="pelayanan.html">Pelayanan</a><button type="button" class="dropdown-caret-btn" aria-label="Buka submenu Pelayanan" aria-expanded="false">▾</button><div class="dropdown-menu"><a href="pelayanan.html#klaster-1">Klaster 1 — Manajemen</a><a href="pelayanan.html#klaster-2">Klaster 2 — Ibu &amp; Anak</a><a href="pelayanan.html#klaster-3">Klaster 3 — Dewasa &amp; Lansia</a><a href="pelayanan.html#klaster-4">Klaster 4 — Penyakit Menular</a><a href="pelayanan.html#klaster-5">Klaster 5 — Lintas Klaster</a></div></div><div class="nav-item-dropdown"><a{informasi_active} href="informasi.html">Informasi</a><button type="button" class="dropdown-caret-btn" aria-label="Buka submenu Informasi" aria-expanded="false">▾</button><div class="dropdown-menu"><a href="pengumuman.html">Pengumuman</a><a href="berita.html">Berita &amp; Kegiatan</a><a href="informasi.html">Galeri Foto &amp; Video</a><a href="edukasi.html">Edukasi</a><a href="program.html">Program &amp; Inovasi</a><a href="index.html#ilp">Informasi ILP</a><a href="download.html">Download</a><a href="kontak.html">Kontak &amp; Lokasi</a></div></div><a class="nav-cta nav-daftar" href="jadwal.html"><span class="cal">📅</span><span class="tx"><strong>Pendaftaran</strong><small>Mobile JKN &amp; Onsite</small></span></a></nav>
</div></header>'''

          changed = []
          for filename, active in pages.items():
              path = repo / filename
              html = path.read_text(encoding='utf-8-sig')
              original = html
              stylesheet = '<link rel="stylesheet" href="styles-home.css?v=20260908-responsive-v2">'
              if stylesheet not in html:
                  html = html.replace('</head>', stylesheet + '\n</head>', 1)
              header = master_header(active)
              updated, count = re.subn(r'<div class="topbar">.*?</header>', header, html, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'Header block not found exactly once in {filename}')
              html = updated
              path.write_text(html, encoding='utf-8')
              if html != original:
                  changed.append(filename)

          print('Patched:', ', '.join(changed) if changed else 'none')

      - name: Commit staged master header migration
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/header-master-batch-20260909'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/p1-responsive-header-qa.yml
          git config user.name "UPTD Puskesmas Tanjung Pinang Kota Jambi"
          git config user.email "313901015+pkmtanjungpinangjambi@users.noreply.github.com"
          git add jadwal.html tarif.html kontak.html manajemen-puskesmas.html .github/workflows/p1-responsive-header-qa.yml
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git commit -m "fix: unify master header across core pages"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare isolated Playwright runtime
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_DIR="${RUNNER_TEMP}/p1-playwright"
          rm -rf "$RUNTIME_DIR"
          mkdir -p "$RUNTIME_DIR"
          npm --prefix "$RUNTIME_DIR" init -y
          npm --prefix "$RUNTIME_DIR" install --no-package-lock @playwright/test@1.55.0
          "$RUNTIME_DIR/node_modules/.bin/playwright" install --with-deps chromium

      - name: Run responsive QA matrix
        shell: bash
        env:
          CI: true
        run: |
          set -euo pipefail
          RUNTIME_DIR="${RUNNER_TEMP}/p1-playwright"
          export NODE_PATH="$RUNTIME_DIR/node_modules${NODE_PATH:+:$NODE_PATH}"
          "$RUNTIME_DIR/node_modules/.bin/playwright" test .github/qa/responsive-header.spec.cjs --reporter=line
