name: P1 Responsive Header QA

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-responsive-header-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_URL: http://127.0.0.1:4173

jobs:
  responsive-header:
    name: Responsive header / navigation
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Start local static server
        shell: bash
        run: |
          set -euo pipefail
          nohup python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/pkm-http-server.log 2>&1 &
          for _ in {1..30}; do
            if curl --fail --silent --show-error "${BASE_URL}/" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error "${BASE_URL}/" >/dev/null

      - name: Prepare isolated Playwright runtime
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_DIR="${RUNNER_TEMP}/p1-playwright"
          rm -rf "$RUNTIME_DIR"
          mkdir -p "$RUNTIME_DIR"
          npm --prefix "$RUNTIME_DIR" init -y
          npm --prefix "$RUNTIME_DIR" install --no-package-lock @playwright/test@1.55.0
          "$RUNTIME_DIR/node_modules/.bin/playwright" install --with-deps chromium

      - name: Run responsive QA matrix
        shell: bash
        env:
          CI: true
        run: |
          set -euo pipefail
          RUNTIME_DIR="${RUNNER_TEMP}/p1-playwright"
          export NODE_PATH="$RUNTIME_DIR/node_modules${NODE_PATH:+:$NODE_PATH}"
          "$RUNTIME_DIR/node_modules/.bin/playwright" test .github/qa/responsive-header.spec.cjs --reporter=line
