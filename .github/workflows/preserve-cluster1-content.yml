name: Preserve moved Cluster 1 content

on:
  push:
    branches:
      - feature/manajemen-puskesmas-cluster-1-clean

permissions:
  contents: write

jobs:
  preserve:
    if: ${{ !contains(github.event.head_commit.message, '[cluster1-preservation]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.ref_name }}

      - name: Preserve all moved Cluster 1 content
        shell: python
        run: |
          from pathlib import Path

          path = Path('manajemen-puskesmas.html')
          text = path.read_text(encoding='utf-8')
          original = text

          css_marker = '.management-preservation-added{'
          if css_marker not in text:
              css = '''
          .management-preservation-added{margin-top:24px}
          .management-poster{margin:18px 0;border:1px solid #dfe9e5;border-radius:16px;background:#fff;padding:16px;box-shadow:0 8px 24px rgba(0,59,45,.06)}
          .management-poster img{display:block;width:100%;max-width:560px;height:auto;border-radius:12px}
          .management-poster-caption{margin:10px 0 0;color:#5d6b66;font-size:.84rem;line-height:1.6}
          .management-values{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
          .management-value{padding:16px;border:1px solid #dfe9e5;border-radius:14px;background:#fff}
          .management-value strong{display:block;color:#0b5d49;margin-bottom:5px}
          .management-value span{color:#64716d;font-size:.85rem;line-height:1.55}
          .management-table{width:100%;border-collapse:collapse;margin-top:16px;background:#fff;border:1px solid #dfe9e5;border-radius:12px;overflow:hidden}
          .management-table th,.management-table td{padding:10px 12px;border-bottom:1px solid #e8efec;text-align:left;vertical-align:top;font-size:.82rem;line-height:1.45}
          .management-table th{background:#f3f8f6;color:#0b5d49;font-weight:900}
          .management-table tr:last-child td{border-bottom:none}
          .management-achievements{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:16px}
          .management-achievement{background:#fff;border:1px solid #dfe9e5;border-radius:16px;padding:18px;box-shadow:0 7px 22px rgba(0,59,45,.05)}
          .management-achievement .year{display:inline-flex;padding:5px 9px;border-radius:999px;background:#e8f3ef;color:#0b5d49;font-size:.74rem;font-weight:900;margin-bottom:8px}
          .management-achievement h3{margin:0 0 7px;color:#0b5d49;font-size:.98rem}
          .management-achievement p{margin:0;color:#65716d;font-size:.84rem;line-height:1.6}
          .management-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
          .management-links a{display:inline-flex;align-items:center;padding:8px 12px;border-radius:999px;background:#eef7f4;color:#0b5d49;border:1px solid #d8ebe5;font-size:.8rem;font-weight:800}
          @media(max-width:760px){.management-values,.management-achievements{grid-template-columns:1fr}.management-table{display:block;overflow-x:auto;white-space:normal}}
          '''
              text = text.replace('</style>', css + '\n</style>', 1)

          nav_old = '<a href="manajemen-puskesmas.html#struktur">Struktur Organisasi</a><a href="manajemen-puskesmas.html#standar-klaster-1">Standar Pelayanan Klaster 1</a>'
          nav_new = '<a href="manajemen-puskesmas.html#struktur">Struktur Organisasi</a><a href="manajemen-puskesmas.html#wilayah">Wilayah Kerja &amp; Pustu</a><a href="manajemen-puskesmas.html#komitmen">Komitmen &amp; IKM</a><a href="manajemen-puskesmas.html#prestasi">Prestasi &amp; Penghargaan</a><a href="manajemen-puskesmas.html#standar-klaster-1">Standar Pelayanan Klaster 1</a>'
          if '#wilayah' not in text and nav_old in text:
              text = text.replace(nav_old, nav_new, 1)

          # Add links from the summary cards to their detailed preserved sections.
          if 'href="#komitmen"' not in text:
              text = text.replace('<h3>Komitmen Pelayanan</h3><p>Komitmen pelayanan dan maklumat pelayanan sebagai penguatan mutu dan akuntabilitas.</p>', '<h3>Komitmen Pelayanan</h3><p>Komitmen pelayanan dan maklumat pelayanan sebagai penguatan mutu dan akuntabilitas.</p><a href="#komitmen">Lihat Maklumat &amp; IKM →</a>')
          if 'href="#prestasi"' not in text:
              text = text.replace('<h3>Prestasi &amp; Penghargaan</h3><p>Dokumentasi capaian dan penghargaan sebagai rekam jejak mutu dan pengembangan pelayanan.</p>', '<h3>Prestasi &amp; Penghargaan</h3><p>Dokumentasi capaian dan penghargaan sebagai rekam jejak mutu dan pengembangan pelayanan.</p><a href="#prestasi">Lihat Prestasi →</a>')

          structure_marker = '<div class="structure-card"><img src="struktur-organisasi.png" alt="Bagan Struktur Organisasi UPTD Puskesmas Tanjung Pinang Kota Jambi" loading="lazy"><div class="structure-copy"><h3>Kepala Puskesmas</h3><p><strong>dr. Tini</strong></p><p>Struktur ini memperlihatkan pembagian fungsi manajemen dan penyelenggaraan pelayanan dalam sistem klaster.</p><p class="admin-ref" style="margin-top:14px">Sumber: Profil UPTD Puskesmas Tanjung Pinang Kota Jambi Tahun 2025 dan pembaruan struktur manajemen 2026.</p></div></div>'
          structure_append = '''
          <div class="management-preservation-added">
            <h3>Penanggung Jawab &amp; Unsur Manajemen Klaster 1</h3>
            <p>Ringkasan pembagian fungsi manajemen yang sebelumnya ditampilkan pada Profil Puskesmas, dipindahkan ke halaman utama Manajemen Puskesmas agar informasi tidak hilang.</p>
            <table class="management-table">
              <thead><tr><th>Unsur Manajemen</th><th>Penanggung Jawab</th></tr></thead>
              <tbody>
                <tr><td>Manajemen Inti Puskesmas</td><td>Nur Saadyah, AM.Keb, SKM</td></tr>
                <tr><td>Manajemen Arsip</td><td>Nur Saadyah, AM.Keb, SKM</td></tr>
                <tr><td>Manajemen Sumber Daya</td><td>Kiki Ayu.A, S.Tr.Keb, MKM</td></tr>
                <tr><td>Sarana, Prasarana &amp; Perbekalan Kesehatan</td><td>Bdn. Fatmawati, S.Keb</td></tr>
                <tr><td>Manajemen Mutu</td><td>Apt. Hj. Susanti, S.Farm</td></tr>
                <tr><td>Manajemen Keuangan &amp; Aset/BMD</td><td>Nur Saadyah, AM.Keb, SKM</td></tr>
                <tr><td>Manajemen Sistem Informasi Digital</td><td>Kiki Ayu.A, S.Tr.Keb, MKM</td></tr>
                <tr><td>Manajemen Jejaring</td><td>drg. Widja Darmi</td></tr>
                <tr><td>Manajemen Pemberdayaan Masyarakat</td><td>Benget Sihotang, SKM</td></tr>
              </tbody>
            </table>
          </div>
          '''
          if 'Penanggung Jawab &amp; Unsur Manajemen Klaster 1' not in text:
              if structure_marker not in text:
                  raise RuntimeError('Structure insertion marker not found')
              text = text.replace(structure_marker, structure_marker + structure_append, 1)

          structure_close = '</section>\n<section class="management-section" id="standar-klaster-1">'
          if 'id="wilayah"' not in text:
              preserved_sections = '''
          <section class="management-section management-preservation-added" id="wilayah">
            <h2>Wilayah Kerja &amp; Puskesmas Pembantu</h2>
            <p>Informasi wilayah kerja dan Puskesmas Pembantu merupakan bagian dari manajemen jejaring dan pelayanan berbasis wilayah.</p>
            <div class="management-values">
              <div class="management-value"><strong>01 · Kelurahan Tanjung Pinang</strong><span>Bagian dari wilayah kerja UPTD Puskesmas Tanjung Pinang.</span></div>
              <div class="management-value"><strong>02 · Kelurahan Rajawali</strong><span>Bagian dari wilayah kerja UPTD Puskesmas Tanjung Pinang.</span></div>
              <div class="management-value"><strong>03 · Kelurahan Kasang</strong><span>Bagian dari wilayah kerja UPTD Puskesmas Tanjung Pinang.</span></div>
              <div class="management-value"><strong>04 · Kelurahan Kasang Jaya</strong><span>Bagian dari wilayah kerja UPTD Puskesmas Tanjung Pinang.</span></div>
              <div class="management-value"><strong>05 · Kelurahan Sijenjang</strong><span>Bagian dari wilayah kerja UPTD Puskesmas Tanjung Pinang.</span></div>
              <div class="management-value"><strong>🏥 Pustu Kasang Jaya</strong><span>Bagian dari jaringan pelayanan UPTD Puskesmas Tanjung Pinang.</span></div>
              <div class="management-value"><strong>🏥 Pustu Sijenjang I</strong><span>Bagian dari jaringan pelayanan UPTD Puskesmas Tanjung Pinang.</span></div>
              <div class="management-value"><strong>🏥 Pustu Sijenjang II</strong><span>Bagian dari jaringan pelayanan UPTD Puskesmas Tanjung Pinang.</span></div>
            </div>
            <div class="admin-ref"><strong>Batas wilayah:</strong> Utara Sungai Batanghari; Selatan Kelurahan Talang Banjar; Barat Kelurahan Pasar Jambi; Timur Kelurahan Tanjung Sari.<br><strong>Sumber:</strong> Profil UPTD Puskesmas Tanjung Pinang Kota Jambi Tahun 2025.</div>
          </section>

          <section class="management-section management-preservation-added" id="komitmen">
            <h2>Maklumat &amp; Komitmen Pelayanan</h2>
            <p>Pernyataan resmi kesiapan UPTD Puskesmas Tanjung Pinang dalam memberikan pelayanan sesuai standar serta menerima masukan masyarakat sebagai bagian dari perbaikan mutu.</p>
            <div class="management-poster"><a href="maklumat.jpeg" target="_blank" rel="noopener noreferrer"><img src="maklumat.jpeg" alt="Maklumat Pelayanan UPTD Puskesmas Tanjung Pinang Kota Jambi" loading="lazy"></a><p class="management-poster-caption">Klik gambar untuk melihat Maklumat Pelayanan dalam ukuran penuh.</p></div>
            <div class="management-grid">
              <article class="management-card"><h3>Standar Pelayanan</h3><p>Pelayanan dipertanggungjawabkan sesuai Standar Pelayanan Puskesmas.</p></article>
              <article class="management-card"><h3>Pengaduan &amp; Masukan</h3><p>Email, call center, WhatsApp, Instagram, Facebook, kotak saran, dan SPAN-LAPOR menjadi kanal masukan masyarakat.</p></article>
              <article class="management-card"><h3>Evaluasi</h3><p>Monitoring dan evaluasi dilakukan melalui mekanisme yang ditetapkan dalam standar pelayanan.</p></article>
            </div>
            <h3 style="margin-top:28px">Survei Kepuasan Masyarakat (IKM)</h3>
            <p>Hasil evaluasi rutin terhadap mutu dan kualitas pelayanan berdasarkan penilaian masyarakat.</p>
            <div class="management-poster"><img src="survei-ikm-tw2.jpg" alt="Poster Hasil Survei Kepuasan Masyarakat Triwulan II 2026 - Nilai IKM 99,29 Sangat Baik" loading="lazy"><p class="management-poster-caption"><strong>Triwulan II 2026 (April–Juni): Nilai IKM 99,29 — Sangat Baik.</strong></p></div>
            <div class="management-poster"><img src="survei-kepuasan-masyarakat.jpg" alt="Poster Hasil Survei Kepuasan Masyarakat Triwulan I 2026 - Nilai IKM 98,54 Sangat Baik" loading="lazy"><p class="management-poster-caption"><strong>Triwulan I 2026 (Januari–Maret): Nilai IKM 98,54 — Sangat Baik.</strong></p></div>
            <div class="management-links"><a href="kontak.html">💬 Hubungi Puskesmas</a></div>
            <p class="admin-ref">Dasar konten: SK Kepala UPTD Puskesmas Tanjung Pinang Nomor 39 Tahun 2026 tentang Standar Pelayanan Publik, ditetapkan 15 Maret 2026.</p>
          </section>

          <section class="management-section management-preservation-added" id="prestasi">
            <h2>Prestasi &amp; Penghargaan</h2>
            <p>Capaian dan penghargaan UPTD Puskesmas Tanjung Pinang sebagai bagian dari rekam jejak mutu, inovasi, dan pengembangan pelayanan.</p>
            <div class="management-achievements">
              <article class="management-achievement"><span class="year">2025</span><h3>Inovasi Pelayanan Publik Terbaik 5 Kota Jambi</h3><p>Penghargaan inovasi pelayanan publik tingkat Kota Jambi.</p></article>
              <article class="management-achievement"><span class="year">2025</span><h3>Pemenang Lomba Inovasi Daerah</h3><p><strong>Inovasi Genre_seh</strong> — pemenang Lomba Inovasi Daerah Tahun 2025.</p></article>
              <article class="management-achievement"><span class="year">2024</span><h3>Puskesmas Rujukan Ramah Anak Provinsi Jambi</h3><p>Menjadi Puskesmas Rujukan Ramah Anak di Provinsi Jambi sejak Tahun 2024.</p></article>
              <article class="management-achievement"><span class="year">2024</span><h3>Puskesmas Ramah Anak Terstandar Nasional</h3><p>Pengakuan sebagai Puskesmas Ramah Anak Terstandar Nasional Tahun 2024.</p></article>
              <article class="management-achievement"><span class="year">2023</span><h3>Puskesmas Lokus KKS Kota Jambi Sehat</h3><p>Puskesmas Lokus KKS Kota Jambi Sehat Tahun 2023.</p></article>
              <article class="management-achievement"><span class="year">2023</span><h3>Akreditasi PARIPURNA II</h3><p>Puskesmas Terakreditasi PARIPURNA ke II pada Tahun 2023.</p></article>
              <article class="management-achievement"><span class="year">2022</span><h3>Inovasi Promosi Kesehatan — “LAGU SADARI”</h3><p>Penghargaan inovatif promosi kesehatan pencegahan kanker payudara dan kanker leher rahim sebagai pencipta “LAGU SADARI”.</p></article>
              <article class="management-achievement"><span class="year">2020</span><h3>Dokter Teladan I Tingkat Provinsi Jambi</h3><p>Dokter Teladan I Tingkat Provinsi Jambi Tahun 2020.</p></article>
              <article class="management-achievement"><span class="year">2019</span><h3>Akreditasi PARIPURNA I</h3><p>Puskesmas Terakreditasi PARIPURNA I pada Tahun 2019.</p></article>
            </div>
            <p class="admin-ref">Sumber: Informasi prestasi dan capaian Puskesmas yang digunakan pada pembaruan profil website.</p>
          </section>

          '''
              if structure_close not in text:
                  raise RuntimeError('End-of-structure insertion marker not found')
              text = text.replace(structure_close, '</section>\n' + preserved_sections + '<section class="management-section" id="standar-klaster-1">', 1)

          # Keep anchor navigation aligned with the new detailed sections.
          if '#wilayah' in text:
              text = text.replace('<a href="#wilayah">Wilayah Kerja &amp; Pustu</a>', '<a href="#wilayah">Wilayah Kerja &amp; Pustu</a>')

          if text == original:
              raise SystemExit('No preservation changes needed.')

          path.write_text(text, encoding='utf-8')
          print('Updated:', path)

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          p = Path('manajemen-puskesmas.html')
          text = p.read_text(encoding='utf-8')
          HTMLParser().feed(text)
          for marker in ['id="struktur"','id="wilayah"','id="komitmen"','id="prestasi"','id="standar-klaster-1"']:
              assert marker in text, f'Missing marker: {marker}'
          for asset in ['maklumat.jpeg','survei-ikm-tw2.jpg','survei-kepuasan-masyarakat.jpg']:
              assert Path(asset).exists(), f'Missing asset: {asset}'
          print('Management page content checks: PASS')
          PY
          git diff --check

      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/preserve-cluster1-content.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manajemen-puskesmas.html .github/workflows/preserve-cluster1-content.yml
          git commit -m 'feat: preserve moved Cluster 1 profile content [cluster1-preservation]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
