name: Normalize Reference Headings Once

on:
  push:
    branches:
      - work/reference-normalizer-fix-2026-09-01

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, '[refnorm]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch reference normalizer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('content-protection.js')
          text = path.read_text(encoding='utf-8')
          old = '''  function normalizeReferenceSections() {
    const candidates = document.querySelectorAll('section, details');
    candidates.forEach(container => {
      const heading = container.matches('details')
        ? container.querySelector(':scope > summary')
        : (container.querySelector(':scope > h2') || container.querySelector(':scope > h3'));
      if (!heading) return;

      const raw = heading.textContent.replace(/\\s+/g, ' ').trim();
      const lower = raw.toLowerCase();
      const isReference = lower.includes('dasar hukum') || lower.includes('dasar &') || lower.includes('referensi');
      if (!isReference) return;

      container.classList.add('references-section');

      if (heading.matches('h2, h3')) {
        const prefixMatch = raw.match(/^\\s*(\\d+\\s*[·.)-]\\s*)/);
        const prefix = prefixMatch ? prefixMatch[1] : '';
        heading.textContent = `${prefix}Dasar Hukum & Referensi`;
      }
    });
  }
'''
          new = '''  function normalizeReferenceSections() {
    const candidates = document.querySelectorAll('section, details');
    candidates.forEach(container => {
      const heading = container.matches('details')
        ? container.querySelector(':scope > summary')
        : (container.querySelector(':scope > h2') || container.querySelector(':scope > h3'));
      if (!heading) return;

      const raw = heading.textContent.replace(/\\s+/g, ' ').trim();
      const lower = raw.toLowerCase();
      const isReference = lower.includes('dasar hukum') || lower.includes('dasar &') || lower.includes('referensi');
      if (!isReference) return;

      container.classList.add('references-section');

      if (heading.matches('h2, h3')) {
        const prefixMatch = raw.match(/^\\s*(\\d+\\s*[·.)-]\\s*)/);
        const prefix = prefixMatch ? prefixMatch[1] : '';
        heading.textContent = `${prefix}Dasar Hukum & Referensi`;
      } else if (container.matches('details')) {
        const number = heading.querySelector('.service-number, .adult-number, .child-number, .admin-index');
        const numberClone = number ? number.cloneNode(true) : null;
        heading.textContent = '';
        if (numberClone) heading.appendChild(numberClone);
        heading.appendChild(document.createTextNode('Dasar Hukum & Referensi'));
      }
    });
  }
'''
          if old not in text:
              raise SystemExit('REFERENCE_NORMALIZER_BLOCK_NOT_FOUND')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          print('REFERENCE_NORMALIZER_PATCHED')
          PY
      - name: Commit reference normalizer
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add content-protection.js
          git diff --cached --check
          git commit -m "fix: normalize reference accordion headings [refnorm]"
          git push
