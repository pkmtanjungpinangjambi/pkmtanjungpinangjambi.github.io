name: SEO Audit

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit metadata, canonical, robots, and sitemap
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Run SEO audit
        shell: python
        run: |
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit
          import re
          import sys
          import xml.etree.ElementTree as ET

          ROOT = Path('.')
          SKIP = {'404.html'}
          failures = []
          warnings = []

          class PageParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.lang = None
                  self.title = ''
                  self.description = ''
                  self.robots = ''
                  self.canonical = []
                  self.h1_count = 0
                  self.in_title = False

              def handle_starttag(self, tag, attrs):
                  attrs_dict = dict(attrs)
                  if tag == 'html':
                      self.lang = attrs_dict.get('lang')
                  elif tag == 'title':
                      self.in_title = True
                  elif tag == 'h1':
                      self.h1_count += 1
                  elif tag == 'meta':
                      name = (attrs_dict.get('name') or '').lower()
                      if name == 'description':
                          self.description = attrs_dict.get('content') or ''
                      elif name == 'robots':
                          self.robots = attrs_dict.get('content') or ''
                  elif tag == 'link' and (attrs_dict.get('rel') or '').lower() == 'canonical':
                      href = attrs_dict.get('href')
                      if href:
                          self.canonical.append(href.strip())

              def handle_endtag(self, tag):
                  if tag == 'title':
                      self.in_title = False

              def handle_data(self, data):
                  if self.in_title:
                      self.title += data

          # Determine canonical host from the homepage rather than hard-coding it.
          index_path = ROOT / 'index.html'
          if not index_path.is_file():
              failures.append('index.html is missing')
              index_canonical = None
          else:
              p = PageParser()
              p.feed(index_path.read_text(encoding='utf-8'))
              p.close()
              index_canonical = p.canonical[0] if p.canonical else None
              if not index_canonical:
                  failures.append('index.html has no canonical URL')

          canonical_origin = None
          if index_canonical:
              parsed = urlsplit(index_canonical)
              if parsed.scheme != 'https' or not parsed.netloc:
                  failures.append(f'Homepage canonical must be absolute HTTPS: {index_canonical}')
              else:
                  canonical_origin = f'{parsed.scheme}://{parsed.netloc}'

          html_files = sorted(ROOT.glob('*.html'))
          canonical_map = {}

          for path in html_files:
              if path.name in SKIP:
                  continue
              text = path.read_text(encoding='utf-8')
              parser = PageParser()
              try:
                  parser.feed(text)
                  parser.close()
              except Exception as exc:
                  failures.append(f'{path}: HTML parsing failed: {exc}')
                  continue

              title = ' '.join(parser.title.split())
              description = ' '.join(parser.description.split())

              if not title:
                  failures.append(f'{path}: missing <title>')
              if not description:
                  failures.append(f'{path}: missing meta description')
              if parser.lang != 'id':
                  warnings.append(f'{path}: html lang is {parser.lang!r}, expected id')
              if len(parser.canonical) != 1:
                  failures.append(f'{path}: expected exactly one canonical URL, found {len(parser.canonical)}')
              if re.search(r'(^|,)\s*noindex\b', parser.robots, re.I):
                  failures.append(f'{path}: robots directive contains noindex')
              if parser.h1_count == 0:
                  warnings.append(f'{path}: no H1 found')
              if len(title) > 70:
                  warnings.append(f'{path}: title is {len(title)} chars')
              if len(description) > 170:
                  warnings.append(f'{path}: description is {len(description)} chars')

              if parser.canonical:
                  canonical = parser.canonical[0]
                  canonical_map.setdefault(canonical, []).append(path.name)
                  parsed = urlsplit(canonical)
                  if parsed.scheme != 'https' or not parsed.netloc:
                      failures.append(f'{path}: canonical must be absolute HTTPS: {canonical}')
                  elif canonical_origin and f'{parsed.scheme}://{parsed.netloc}' != canonical_origin:
                      failures.append(f'{path}: canonical origin differs from homepage: {canonical}')

          for canonical, pages in canonical_map.items():
              if len(pages) > 1:
                  failures.append(f'Duplicate canonical URL {canonical} used by: {", ".join(pages)}')

          robots = ROOT / 'robots.txt'
          if not robots.is_file():
              failures.append('robots.txt is missing')
          else:
              robots_text = robots.read_text(encoding='utf-8')
              if 'allow: /' not in robots_text.lower():
                  failures.append('robots.txt does not explicitly allow /')
              if 'sitemap:' not in robots_text.lower():
                  failures.append('robots.txt does not advertise a sitemap')

          sitemap = ROOT / 'sitemap.xml'
          sitemap_urls = []
          if not sitemap.is_file():
              failures.append('sitemap.xml is missing')
          else:
              try:
                  tree = ET.parse(sitemap)
                  root = tree.getroot()
                  ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
                  sitemap_urls = [loc.text.strip() for loc in root.findall('sm:url/sm:loc', ns) if loc.text and loc.text.strip()]
                  if not sitemap_urls:
                      failures.append('sitemap.xml contains no <loc> URLs')
              except Exception as exc:
                  failures.append(f'sitemap.xml is invalid XML: {exc}')

          # Sitemap should contain each indexable root HTML page exactly once.
          if canonical_origin:
              expected = {}
              for path in html_files:
                  if path.name in SKIP:
                      continue
                  expected_url = canonical_origin + ('/' if path.name == 'index.html' else '/' + path.name)
                  expected[path.name] = expected_url

              sitemap_set = set(sitemap_urls)
              for name, url in expected.items():
                  if url not in sitemap_set:
                      failures.append(f'sitemap.xml is missing indexable page: {name} -> {url}')

              for url in sitemap_urls:
                  parsed = urlsplit(url)
                  if f'{parsed.scheme}://{parsed.netloc}' != canonical_origin:
                      failures.append(f'sitemap.xml contains non-canonical origin: {url}')
                  if parsed.query or parsed.fragment:
                      failures.append(f'sitemap.xml URL should not contain query/fragment: {url}')

              duplicate_sitemap = sorted({u for u in sitemap_urls if sitemap_urls.count(u) > 1})
              for url in duplicate_sitemap:
                  failures.append(f'sitemap.xml contains duplicate URL: {url}')

          print(f'Pages audited: {len([p for p in html_files if p.name not in SKIP])}')
          print(f'Sitemap URLs: {len(sitemap_urls)}')
          print(f'Warnings: {len(warnings)}')
          for item in warnings:
              print(f'WARN - {item}')

          if failures:
              print('SEO AUDIT FAILED')
              for item in failures:
                  print(f'FAIL - {item}')
              sys.exit(1)

          print('SEO AUDIT PASSED')
          print('PASS - title/description/canonical/robots checks')
          print('PASS - canonical origin consistency')
          print('PASS - sitemap coverage and canonical origin')
          print('PASS - robots.txt advertises sitemap')
