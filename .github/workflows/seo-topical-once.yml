name: One-time topical SEO updater

on:
  push:
    branches:
      - seo/topical-pages-20260907

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Optimize topical pages
        shell: python
        run: |
          from pathlib import Path
          import html
          import json
          import re

          ORIGIN = 'https://pkmtanjungpinangjambi.vercel.app'
          TARGETS = {
              'pelayanan-ckg.html': {
                  'title': 'Cek Kesehatan Gratis (CKG) | UPTD Puskesmas Tanjung Pinang Kota Jambi',
                  'description': 'Informasi Cek Kesehatan Gratis (CKG) di UPTD Puskesmas Tanjung Pinang Kota Jambi, sasaran, alur, pemeriksaan, dan tindak lanjut.',
                  'crumb': 'Cek Kesehatan Gratis (CKG)',
              },
              'pelayanan-imunisasi.html': {
                  'title': 'Layanan Imunisasi | UPTD Puskesmas Tanjung Pinang Kota Jambi',
                  'description': 'Informasi layanan imunisasi UPTD Puskesmas Tanjung Pinang Kota Jambi, jadwal lokal, sasaran, persyaratan, alur, dan ketentuan pelayanan.',
                  'crumb': 'Layanan Imunisasi',
              },
              'pelayanan-ibu-hamil-bersalin-nifas.html': {
                  'title': 'Layanan Kesehatan Ibu Hamil, Bersalin & Nifas | UPTD Puskesmas Tanjung Pinang Kota Jambi',
                  'description': 'Informasi layanan kesehatan ibu hamil, bersalin, dan nifas di UPTD Puskesmas Tanjung Pinang Kota Jambi, fasilitas, alur, dan persiapan.',
                  'crumb': 'Kesehatan Ibu Hamil, Bersalin & Nifas',
              },
              'pelayanan-tuberkulosis.html': {
                  'title': 'Layanan Tuberkulosis (TB) | UPTD Puskesmas Tanjung Pinang Kota Jambi',
                  'description': 'Informasi layanan tuberkulosis (TB) di UPTD Puskesmas Tanjung Pinang Kota Jambi: pemeriksaan, pengobatan, pemantauan, edukasi, dan tindak lanjut.',
                  'crumb': 'Layanan Tuberkulosis (TB)',
              },
              'pelayanan-kesehatan-gigi-mulut.html': {
                  'title': 'Layanan Kesehatan Gigi & Mulut | UPTD Puskesmas Tanjung Pinang Kota Jambi',
                  'description': 'Informasi pelayanan kesehatan gigi dan mulut di UPTD Puskesmas Tanjung Pinang Kota Jambi, pemeriksaan, perawatan, edukasi, dan tindak lanjut.',
                  'crumb': 'Kesehatan Gigi & Mulut',
              },
          }

          def replace_or_insert(text: str, pattern: str, replacement: str, insert_after: str | None = None) -> str:
              if re.search(pattern, text, flags=re.I):
                  return re.sub(pattern, replacement, text, count=1, flags=re.I)
              if insert_after and insert_after in text:
                  return text.replace(insert_after, insert_after + '\n' + replacement, 1)
              raise SystemExit(f'Anchor not found for insertion: {insert_after!r}')

          changed = []
          for filename, meta in TARGETS.items():
              path = Path(filename)
              if not path.is_file():
                  raise SystemExit(f'Missing target page: {filename}')

              text = path.read_text(encoding='utf-8')
              title = html.escape(meta['title'], quote=True)
              description = html.escape(meta['description'], quote=True)
              canonical = f'{ORIGIN}/{filename}'
              if filename == 'pelayanan-ckg.html':
                  canonical = f'{ORIGIN}/pelayanan-ckg.html'

              text = replace_or_insert(
                  text,
                  r'<title>.*?</title>',
                  f'<title>{title}</title>'
              )
              text = replace_or_insert(
                  text,
                  r'<meta\s+name=["\']description["\'][^>]*>',
                  f'<meta name="description" content="{description}">',
                  f'<title>{title}</title>'
              )

              for name, content in [
                  ('og:title', title),
                  ('og:description', description),
                  ('og:url', canonical),
                  ('twitter:title', title),
                  ('twitter:description', description),
              ]:
                  tag = f'<meta property="{name}" content="{content}">' if name.startswith('og:') else f'<meta name="{name}" content="{content}">'
                  pattern = rf'<meta\s+(?:property|name)=["\']{re.escape(name)}["\'][^>]*>'
                  text = replace_or_insert(text, pattern, tag, f'<meta name="robots" content="index,follow,max-image-preview:large">')

              if not re.search(r'<meta\s+name=["\']twitter:card["\'][^>]*>', text, re.I):
                  twitter_card = '<meta name="twitter:card" content="summary_large_image">'
                  text = replace_or_insert(text, r'<meta\s+name=["\']robots["\'][^>]*>', twitter_card, f'<meta name="robots" content="index,follow,max-image-preview:large">')

              marker = 'data-seo-id="topical-page"'
              if marker not in text:
                  schema = {
                      '@context': 'https://schema.org',
                      '@type': 'WebPage',
                      '@id': f'{canonical}#webpage',
                      'url': canonical,
                      'name': meta['title'],
                      'description': meta['description'],
                      'inLanguage': 'id-ID',
                      'isPartOf': {'@id': f'{ORIGIN}/#website'},
                      'about': {'@id': f'{ORIGIN}/#organization'},
                  }
                  breadcrumb = {
                      '@context': 'https://schema.org',
                      '@type': 'BreadcrumbList',
                      'itemListElement': [
                          {'@type': 'ListItem', 'position': 1, 'name': 'Beranda', 'item': f'{ORIGIN}/'},
                          {'@type': 'ListItem', 'position': 2, 'name': 'Pelayanan', 'item': f'{ORIGIN}/pelayanan.html'},
                          {'@type': 'ListItem', 'position': 3, 'name': meta['crumb'], 'item': canonical},
                      ],
                  }
                  block = (
                      '<script type="application/ld+json" data-seo-id="topical-page">\n'
                      + json.dumps(schema, ensure_ascii=False, indent=2)
                      + '\n</script>\n'
                      + '<script type="application/ld+json" data-seo-id="topical-breadcrumb">\n'
                      + json.dumps(breadcrumb, ensure_ascii=False, indent=2)
                      + '\n</script>'
                  )
                  text = text.replace('</head>', block + '\n</head>', 1)

              path.write_text(text, encoding='utf-8')
              changed.append(filename)

          print('Optimized:', ', '.join(changed))

      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/seo-topical-once.yml
          git add pelayanan-ckg.html pelayanan-imunisasi.html pelayanan-ibu-hamil-bersalin-nifas.html pelayanan-tuberkulosis.html pelayanan-kesehatan-gigi-mulut.html .github/workflows/seo-topical-once.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'feat(seo): strengthen topical service metadata'
          git push origin HEAD:seo/topical-pages-20260907
