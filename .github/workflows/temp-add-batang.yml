name: temp-add-batang
on:
  push:
    branches:
      - feat/klaster1-batang-20260914
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add BATANG to Ketatausahaan
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('manajemen-puskesmas.html')
          s = p.read_text(encoding='utf-8-sig')
          marker = '''</details>\n</div><div class="admin-ref"><strong>Rujukan utama:</strong>'''
          item = '''<details class="admin-item"><summary><span class="admin-index">07</span>BATANG — Buku Administrasi Tamu Aktual Nyata Digital</summary><div class="admin-body"><strong>Buku tamu elektronik untuk pencatatan kunjungan tamu Puskesmas.</strong><br>BATANG ditempatkan sebagai bagian dari Ketatausahaan dan digunakan untuk mendukung pencatatan administrasi tamu secara tertib dan digital.</div></details>\n'''
          if item in s:
              raise SystemExit('BATANG sudah ada')
          if marker not in s:
              raise SystemExit('Marker Ketatausahaan tidak ditemukan')
          s = s.replace(marker, item + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "UPTD Puskesmas Tanjung Pinang Kota Jambi"
          git config user.email "313901015+pkmtanjungpinangjambi@users.noreply.github.com"
          rm .github/workflows/temp-add-batang.yml
          git add manajemen-puskesmas.html .github/workflows/temp-add-batang.yml
          git diff --cached --check
          git commit -m "feat: tambahkan BATANG pada ketatausahaan"
          git push