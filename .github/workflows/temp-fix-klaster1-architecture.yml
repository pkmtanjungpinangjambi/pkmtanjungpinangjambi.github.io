name: temp-fix-klaster1-architecture
on:
  push:
    branches:
      - fix/arsitektur-klaster1-paragraf-20260914
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch one paragraph only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('manajemen-puskesmas.html')
          s = p.read_text(encoding='utf-8-sig')
          old = 'Menu Profil berfokus pada identitas dan karakteristik Puskesmas, sedangkan menu Pelayanan berfokus pada Klaster 2–5. Standar pelayanan Klaster 1 ditempatkan sebagai unsur penunjang di dalam Manajemen Puskesmas.'
          new = 'Dalam struktur <strong>Pelayanan</strong>, Klaster 1 adalah <strong>Manajemen</strong>, sedangkan Klaster 2–5 merupakan kelompok pelayanan kesehatan. Karena itu, informasi dan fungsi manajemen ditempatkan di sini sebagai pusat pengelolaan Klaster 1, termasuk unsur administrasi, sumber daya, mutu, jejaring, pemberdayaan, struktur organisasi, dan standar pelayanan.'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one target paragraph, found {s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove temporary workflow and commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-fix-klaster1-architecture.yml
          git add manajemen-puskesmas.html
          git commit -m "docs: konsistenkan arsitektur Klaster 1"
          git push
