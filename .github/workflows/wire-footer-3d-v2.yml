name: Wire Footer 3D V2

on:
  push:
    branches:
      - design/footer-3d-v2-20260904

permissions:
  contents: write

jobs:
  wire-footer:
    if: "!contains(github.event.head_commit.message, 'wire footer 3d v2')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add footer stylesheet link safely
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          link = '<link rel="stylesheet" href="footer-3d-v2.css?v=20260904-v2">'

          if link not in html:
              anchor = '<link rel="stylesheet" href="styles-home.css?v=20260904-homev2">'
              if anchor in html:
                  html = html.replace(anchor, anchor + '\n' + link, 1)
              else:
                  raise SystemExit('styles-home.css link anchor not found; refusing unsafe edit')
              path.write_text(html, encoding='utf-8')
          else:
              print('Footer stylesheet already linked; no change needed.')

      - name: Commit footer wiring
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'chore: wire footer 3d v2'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
