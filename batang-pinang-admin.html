<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BATANG PINANG Admin | UPTD Puskesmas Tanjung Pinang</title><link rel="stylesheet" href="styles.css?v=20260824-info1"><style>.wrap{max-width:1100px;margin:0 auto}.card{background:#fff;border:1px solid #dfe9e5;border-radius:20px;padding:22px;box-shadow:0 10px 28px rgba(0,59,45,.07)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.metric{padding:18px;border:1px solid #dfe9e5;border-radius:16px;background:#f7fbf9}.metric strong{display:block;font-size:1.7rem;color:#0b5d49}.metric span{color:#66736e;font-size:.82rem}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:18px 0}.field{display:flex;flex-direction:column;gap:6px}label{font-size:.8rem;font-weight:800;color:#38564d}input{padding:11px 12px;border:1px solid #d5e4de;border-radius:10px;font:inherit}.btn{padding:11px 15px;border:0;border-radius:11px;font:inherit;font-weight:900;cursor:pointer}.primary{background:#0b5d49;color:#fff}.secondary{background:#eef7f4;color:#0b5d49;border:1px solid #d8ebe5}.danger{background:#f9eded;color:#9b3d35}.table-wrap{overflow:auto;margin-top:18px}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:10px 11px;border-bottom:1px solid #e7efec;text-align:left;font-size:.8rem;vertical-align:top}th{background:#f3f8f6;color:#0b5d49}.status{min-height:22px;margin-top:10px;font-size:.82rem}.ok{color:#0b6b4f}.err{color:#9b3d35}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><div class="container"><a class="back-link" href="manajemen-puskesmas.html#ketatausahaan">← Kembali ke Ketatausahaan</a></div><section class="page-hero"><div class="container"><span class="eyebrow">Klaster 1 — Internal</span><h1>BATANG PINANG Admin</h1><p>Dashboard internal buku administrasi tamu. Hanya akun dengan role <strong>batang_admin</strong> yang dapat membaca data.</p></div></section><main class="page-content"><div class="container wrap"><section id="login" class="card"><h2>Login Admin</h2><div class="bar"><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password"></div><button id="loginBtn" class="btn primary">Masuk</button></div><div id="status" class="status" aria-live="polite"></div></section><section id="app" class="card" hidden><div class="bar"><button id="refreshBtn" class="btn primary">Muat Ulang</button><button id="exportBtn" class="btn secondary">Export CSV</button><button id="logoutBtn" class="btn danger">Keluar</button></div><div class="grid"><div class="metric"><strong id="todayCount">0</strong><span>Kunjungan hari ini</span></div><div class="metric"><strong id="rangeCount">0</strong><span>Kunjungan periode</span></div><div class="metric"><strong id="userEmail">-</strong><span>Admin aktif</span></div></div><div class="bar"><div class="field"><label for="from">Dari tanggal</label><input id="from" type="date"></div><div class="field"><label for="to">Sampai tanggal</label><input id="to" type="date"></div></div><div class="table-wrap"><table><thead><tr><th>Jam</th><th>Nama</th><th>Asal/Instansi</th><th>Keperluan</th><th>Tujuan/Unit</th><th>No. HP</th><th>Catatan</th></tr></thead><tbody id="rows"></tbody></table></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(()=>{'use strict';const URL='https://pguspipnuyqmrnzirekm.supabase.co',KEY='sb_publishable_jLOp7eqVR5o_Fb0IVHOS9Q_V3xEh3vW',TABLE='batang_pinang_kunjungan',supabase=window.supabase.createClient(URL,KEY),login=document.getElementById('login'),app=document.getElementById('app'),status=document.getElementById('status'),rows=document.getElementById('rows'),from=document.getElementById('from'),to=document.getElementById('to'),pad=n=>String(n).padStart(2,'0'),isoToday=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};from.value=isoToday();to.value=isoToday();const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));async function load(){status.textContent='Memuat data…';status.className='status';const f=from.value||'1900-01-01',t=to.value||'2999-12-31';const {data,error}=await supabase.from(TABLE).select('tanggal,jam_datang,nama,asal_instansi,keperluan,tujuan_unit,no_hp,catatan').gte('tanggal',f).lte('tanggal',t).order('tanggal',{ascending:false}).order('jam_datang',{ascending:false});if(error){status.textContent=error.message;status.className='status err';return}rows.innerHTML=(data||[]).map(r=>`<tr><td>${esc(r.jam_datang)}</td><td>${esc(r.nama)}</td><td>${esc(r.asal_instansi||'-')}</td><td>${esc(r.keperluan)}</td><td>${esc(r.tujuan_unit||'-')}</td><td>${esc(r.no_hp||'-')}</td><td>${esc(r.catatan||'-')}</td></tr>`).join('')||'<tr><td colspan="7">Tidak ada data.</td></tr>';document.getElementById('rangeCount').textContent=(data||[]).length;status.textContent='Data berhasil dimuat.';status.className='status ok';const td=isoToday();document.getElementById('todayCount').textContent=(data||[]).filter(r=>r.tanggal===td).length;return data||[]}function csv(rows){const head=['Tanggal','Jam','Nama','Asal/Instansi','Keperluan','Tujuan/Unit','No. HP','Catatan'],q=v=>`\"${String(v??'').replace(/\"/g,'\"\"')}\"`;const out=[head.map(q).join(',')];rows.forEach(r=>out.push([r.tanggal,r.jam_datang,r.nama,r.asal_instansi,r.keperluan,r.tujuan_unit,r.no_hp,r.catatan].map(q).join(',')));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out.join('\n')],{type:'text/csv;charset=utf-8'}));a.download=`batang-pinang-${from.value}-${to.value}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}document.getElementById('loginBtn').onclick=async()=>{const email=document.getElementById('email').value,password=document.getElementById('password').value;if(!email||!password)return;const {data,error}=await supabase.auth.signInWithPassword({email,password});if(error){status.textContent=error.message;status.className='status err';return}const role=data.user?.app_metadata?.role;if(role!=='batang_admin'){await supabase.auth.signOut();status.textContent='Akun berhasil login tetapi tidak memiliki role batang_admin.';status.className='status err';return}document.getElementById('userEmail').textContent=data.user.email||'-';login.hidden=true;app.hidden=false;await load()};document.getElementById('refreshBtn').onclick=load;document.getElementById('exportBtn').onclick=async()=>csv(await load());document.getElementById('logoutBtn').onclick=async()=>{await supabase.auth.signOut();app.hidden=true;login.hidden=false;status.textContent='Anda sudah keluar.';status.className='status ok'};supabase.auth.getSession().then(async({data})=>{const u=data.session?.user;if(u?.app_metadata?.role==='batang_admin'){document.getElementById('userEmail').textContent=u.email||'-';login.hidden=true;app.hidden=false;load()}})})();</script><script src="content-protection.js" defer></script></body></html>
